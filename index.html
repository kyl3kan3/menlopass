<style>
/* ============================================================
   Meno Compass — styles
   Mobile-first, light/dark, no external deps.
   ============================================================ */

@font-face{
  font-family:"Bricolage Grotesque";
  src:url("assets/fonts/bricolage-grotesque-latin.woff2") format("woff2");
  font-style:normal;
  font-weight:200 800;
  font-display:swap;
}

:root {
  --plum-50:#faf6f8; --plum-100:#f3e9ef; --plum-200:#e6d2de;
  --plum-400:#a86e91; --plum-500:#8d5077; --plum-600:#743d61; --plum-700:#5a2e4b;
  --sage-100:#e8f0ea; --sage-400:#7ba58c; --sage-600:#4e7a61;
  --amber-100:#fdf1dc; --amber-500:#c98a1e; --amber-700:#8a5c07;
  --rose-100:#fde8e8; --rose-500:#c94a4a; --rose-700:#8f2f2f;
  --blue-100:#e6eef7; --blue-500:#3f6f9f;

  --bg:#fbf9fa;
  --surface:#ffffff;
  --surface-2:var(--plum-50);
  --surface-3:var(--plum-100);
  --border:#e8e0e5;
  --border-strong:#d6c8d0;
  --text:#2c2229;
  --text-2:#5d5058;
  /* Passes WCAG AA for small text on the light surfaces used below. */
  --text-3:#70636b;
  --accent:var(--plum-600);
  --accent-soft:var(--plum-100);
  --accent-text:var(--plum-700);
  --ok:var(--sage-600);
  --ok-soft:var(--sage-100);
  --warn:var(--amber-700);
  --warn-soft:var(--amber-100);
  --alert:var(--rose-700);
  --alert-soft:var(--rose-100);
  --info:var(--blue-500);
  --info-soft:var(--blue-100);
  --shadow:0 1px 2px rgba(44,34,41,.06), 0 4px 16px rgba(44,34,41,.05);
  --shadow-lg:0 8px 40px rgba(44,34,41,.16);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --nav-h:64px;
  --maxw:720px;
  --ff:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

html[data-theme="dark"] {
  --bg:#141016;
  --surface:#1e1821;
  --surface-2:#261e2a;
  --surface-3:#2f2534;
  --border:#352b3a;
  --border-strong:#473a4d;
  --text:#f2ecf1;
  --text-2:#c0b3bd;
  --text-3:#94858f;
  --accent:#d9a3c4;
  --accent-soft:#3a2a37;
  --accent-text:#eec5dd;
  --ok:#8fc7a6;  --ok-soft:#22342a;
  --warn:#e0b565; --warn-soft:#382d18;
  --alert:#f09393; --alert-soft:#3b2124;
  --info:#8fb6dc;  --info-soft:#1c2836;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 8px 40px rgba(0,0,0,.55);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.native-app,html.native-app body{touch-action:manipulation}
body{
  margin:0; font-family:var(--ff); background:var(--bg); color:var(--text);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{line-height:1.25; margin:0 0 .4em; font-weight:650; letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1.02rem} h4{font-size:.94rem}
p{margin:0 0 .8em}
a{color:var(--accent-text)}
button{font-family:inherit; font-size:inherit; cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- layout ---------- */
#app{max-width:var(--maxw); margin:0 auto; padding:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px)}
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--bg) 88%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border); padding:10px 16px;
  display:flex; align-items:center; gap:10px; min-height:54px;
}
.topbar h1{font-size:1.12rem; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.topbar .sub{font-size:.72rem; color:var(--text-3); font-weight:500; display:block; letter-spacing:.02em}
.view{padding:16px 16px 8px; animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:color-mix(in srgb,var(--surface) 94%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
}
nav.tabs .inner{max-width:var(--maxw); margin:0 auto; display:flex; width:100%}
nav.tabs button{
  flex:1; background:none; border:0; padding:8px 2px 10px; color:var(--text-3);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:.68rem; font-weight:600; letter-spacing:.02em; height:var(--nav-h);
  justify-content:center; transition:color .15s;
}
nav.tabs button svg{width:23px;height:23px;stroke-width:1.7}
nav.tabs button[aria-current="page"]{color:var(--accent-text)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.3}

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:16px; margin:0 0 14px; box-shadow:var(--shadow);
}
.card.tight{padding:13px 14px}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card h2,.card h3{margin-top:0}
.card-head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}
.card-head h2,.card-head h3{flex:1; margin:0}
.section-label{
  font-size:.7rem; font-weight:750; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-3); margin:22px 0 9px;
}
.muted{color:var(--text-2)}
.tiny{font-size:.79rem; line-height:1.5}
.xtiny{font-size:.72rem; line-height:1.45; color:var(--text-3)}
.center{text-align:center}
hr.sep{border:0;border-top:1px solid var(--border);margin:14px 0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  border-radius:var(--r-sm); padding:11px 15px; min-height:44px; font-weight:600; font-size:.9rem;
  transition:transform .1s, background .15s; text-decoration:none;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
html[data-theme="dark"] .btn.primary{color:#1b1119}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.sm{padding:9px 13px; font-size:.82rem; min-height:40px}
.btn.block{width:100%}
.btn.danger{color:var(--alert); border-color:var(--alert)}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}
.btn-row.split>*{flex:1}

/* ---------- form ---------- */
label.fl{display:block; font-weight:600; font-size:.86rem; margin:0 0 5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; padding:11px 12px; border:1px solid var(--border-strong); border-radius:var(--r-sm);
  background:var(--surface); color:var(--text); font-family:inherit; font-size:1rem;
}
textarea{min-height:76px; resize:vertical}
.field{margin-bottom:14px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.inline-unit{display:flex;gap:8px;align-items:center}
.inline-unit select{width:auto;flex:0 0 auto}

/* stepper */
.stepper{display:flex; align-items:center; gap:12px; justify-content:space-between}
.stepper .val{font-size:2rem; font-weight:700; font-variant-numeric:tabular-nums; min-width:2.4ch; text-align:center}
.stepper button{
  width:46px;height:46px;border-radius:50%;border:1px solid var(--border-strong);
  background:var(--surface-2); color:var(--text); font-size:1.4rem; font-weight:600;
  display:grid;place-items:center; line-height:1;
}
.stepper button:active{transform:scale(.96)}

/* scale 0-4 / 1-5 pickers */
.scale{display:flex; gap:6px}
.scale button{
  flex:1; border:1px solid var(--border); background:var(--surface-2); color:var(--text-2);
  border-radius:var(--r-sm); padding:9px 0; font-weight:650; font-size:.9rem;
  min-height:42px;
}
.scale button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
html[data-theme="dark"] .scale button[aria-pressed="true"]{color:#1b1119}
.scale-legend{display:flex;justify-content:space-between;margin-top:4px}
.scale-legend span{font-size:.68rem;color:var(--text-3)}

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:999px; padding:9px 14px; font-size:.84rem; font-weight:600;
  min-height:40px; display:inline-flex; align-items:center;
}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-text)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.toggle-row+.toggle-row{border-top:1px solid var(--border)}
.switch{
  position:relative;width:48px;height:28px;flex:0 0 auto;border-radius:999px;
  border:1px solid var(--border-strong);background:var(--surface-2);transition:background .18s;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:var(--text-3);transition:transform .18s,background .18s;
}
.switch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(20px);background:#fff}

/* ---------- badges & callouts ---------- */
.badge{
  display:inline-block;font-size:.66rem;font-weight:750;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);white-space:nowrap;
}
.badge.strong{background:var(--ok-soft);color:var(--ok)}
.badge.moderate{background:var(--info-soft);color:var(--info)}
.badge.mixed{background:var(--warn-soft);color:var(--warn)}
.badge.none{background:var(--alert-soft);color:var(--alert)}
.badge.accent{background:var(--accent-soft);color:var(--accent-text)}

.callout{
  border-radius:var(--r-sm); padding:12px 14px; margin:0 0 12px; font-size:.87rem;
  border:1px solid transparent; line-height:1.5;
}
.callout p:last-child{margin-bottom:0}
.callout strong{font-weight:700}
.callout.info{background:var(--info-soft); border-color:color-mix(in srgb,var(--info) 30%, transparent); color:var(--text)}
.callout.ok{background:var(--ok-soft); border-color:color-mix(in srgb,var(--ok) 30%, transparent)}
.callout.warn{background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 35%, transparent)}
.callout.alert{background:var(--alert-soft); border-color:color-mix(in srgb,var(--alert) 40%, transparent)}
.callout .ctitle{font-weight:750;display:block;margin-bottom:3px;font-size:.83rem;letter-spacing:.01em}

/* ---------- stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:9px}
.tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:11px 12px; box-shadow:var(--shadow);
}
.tile .k{font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-3)}
.tile .v{font-size:1.42rem; font-weight:720; font-variant-numeric:tabular-nums; line-height:1.15; margin-top:2px}
.tile .d{font-size:.7rem; color:var(--text-3)}
.tile .v small{font-size:.6em;font-weight:600;color:var(--text-3)}

/* ---------- accordion / list rows ---------- */
.rows{border:1px solid var(--border); border-radius:var(--r); overflow:hidden; background:var(--surface); box-shadow:var(--shadow); margin-bottom:14px}
.row{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:13px 14px; background:none; border:0; border-bottom:1px solid var(--border); color:var(--text);
}
.row:last-child{border-bottom:0}
.row .ico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);
  display:grid;place-items:center;flex:0 0 auto;font-size:1rem}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:650;font-size:.94rem}
.row .txt span{display:block;font-size:.77rem;color:var(--text-3);line-height:1.4}
.row .chev{color:var(--text-3);flex:0 0 auto}
.row:active{background:var(--surface-2)}

details.acc{border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface); margin-bottom:9px; overflow:hidden}
details.acc>summary{
  padding:12px 14px; font-weight:650; font-size:.92rem; cursor:pointer; list-style:none;
  display:flex; align-items:center; gap:9px;
}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+"; margin-left:auto; color:var(--text-3); font-size:1.15rem; font-weight:400}
details.acc[open]>summary::after{content:"–"}
details.acc>div{padding:0 14px 14px; font-size:.88rem}
details.acc>div>*:last-child{margin-bottom:0}

/* ---------- tables ---------- */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 0 12px;
  background:linear-gradient(to right,transparent 92%,var(--surface-3));
  background-attachment:local; border-radius:var(--r-sm);}
table{border-collapse:collapse; width:100%; font-size:.82rem; min-width:340px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top}
th{font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); font-weight:750; white-space:nowrap}
td b{font-weight:680}
tbody tr:last-child td{border-bottom:0}

/* ---------- charts ---------- */
.chart{width:100%; display:block; overflow:visible}
.chart .grid{stroke:var(--border); stroke-width:1}
.chart .axis{fill:var(--text-3); font-size:9px}
.chart .ln{fill:none; stroke:var(--accent); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round}
.chart .ln2{fill:none; stroke:var(--info); stroke-width:1.6; stroke-dasharray:4 3}
.chart .ar{fill:var(--accent); opacity:.12}
.chart .dot{fill:var(--accent)}
.chart .bar{fill:var(--accent); opacity:.85}
.chart .bar.dim{opacity:.3}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.chart-legend span{font-size:.72rem;color:var(--text-3);display:flex;align-items:center;gap:5px}
.chart-legend i{width:12px;height:3px;border-radius:2px;background:var(--accent);display:block}
.chart-legend i.b{background:var(--info)}
.seg{display:flex;gap:4px;background:var(--surface-3);padding:3px;border-radius:999px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:999px;font-size:.8rem;font-weight:650;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-3);display:block}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 25%, var(--surface-3))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 50%, var(--surface-3))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 75%, var(--surface-3))}
.heat i[data-l="4"]{background:var(--accent)}

/* ---------- modal / sheet ---------- */
.sheet-bg{
  position:fixed; inset:0; z-index:100; background:rgba(20,14,20,.5);
  display:flex; align-items:flex-end; justify-content:center; padding:0;
  animation:fade .18s ease;
}
.sheet{
  background:var(--bg); width:100%; max-width:var(--maxw); max-height:92vh; overflow-y:auto;
  border-radius:var(--r-lg) var(--r-lg) 0 0; box-shadow:var(--shadow-lg);
  padding:0 16px calc(24px + env(safe-area-inset-bottom));
  animation:up .24s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-bar{
  position:sticky; top:0; background:var(--bg); padding:14px 0 10px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border); margin-bottom:14px; z-index:2;
}
.sheet-bar h2{flex:1; margin:0; font-size:1.05rem}
.xbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);display:grid;place-items:center;font-size:1.1rem;flex:0 0 auto}

/* ---------- misc ---------- */
.pill-note{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--text-3);
  background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 10px}
.empty{text-align:center;padding:30px 16px;color:var(--text-3)}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:8px}
ul.tick{list-style:none;padding:0;margin:0 0 10px}
ul.tick li{padding-left:22px;position:relative;margin-bottom:6px;font-size:.88rem}
ul.tick li::before{content:"";position:absolute;left:4px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
ul.plain{padding-left:20px;margin:0 0 10px}
ul.plain li{margin-bottom:5px;font-size:.88rem}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.87rem}
.kv:last-child{border-bottom:0}
.kv b{font-weight:680;text-align:right}
.srcs{font-size:.74rem;color:var(--text-3);line-height:1.6}
.srcs a{color:var(--accent-text);text-decoration-thickness:.08em;text-underline-offset:.14em}
.stamp{font-size:.7rem;color:var(--text-3);margin-top:10px;font-style:italic}
.progress{height:7px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.progress i.ok{background:var(--ok)}
.dayscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dayscroll::-webkit-scrollbar{display:none}
.dayscroll button{
  flex:0 0 auto;width:46px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);
  padding:6px 0;text-align:center;color:var(--text-2);
}
.dayscroll button b{display:block;font-size:1rem;font-weight:680;line-height:1.2}
.dayscroll button span{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em}
.dayscroll button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .dayscroll button[aria-pressed="true"]{color:#1b1119}
.dayscroll button.has::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--ok);margin:2px auto 0}
.dayscroll button[aria-pressed="true"].has::after{background:#fff}

.fab-note{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
  z-index:60;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:.85rem;font-weight:600;box-shadow:var(--shadow-lg);animation:up .2s ease;max-width:90%;text-align:center;
}

/* ============================================================
   Twilight redesign — translated from the selected reference
   ============================================================ */
:root{
  --stage:#E8ECEB;
  --bg:#F1F4F3;
  --surface:#FFFFFF;
  --surface-2:#E8ECEB;
  --surface-3:#DBE4E2;
  --border:#DBE4E2;
  --border-strong:#C6D0CE;
  --text:#12201F;
  --text-2:#4E605D;
  --text-3:#596B68;
  --accent:#B26A12;
  --accent-soft:#F2E3CC;
  --accent-text:#8A500B;
  --ok:#3C7B61;
  --ok-soft:#E1EEE8;
  --warn:#9A5B10;
  --warn-soft:#F2E3CC;
  --alert:#BB4E37;
  --alert-soft:#F5E2DE;
  --info:#4E605D;
  --info-soft:#FFFFFF;
  --button-bg:#12201F;
  --button-label:#F1F4F3;
  --shadow:none;
  --shadow-lg:0 30px 80px rgba(0,0,0,.25);
  --r:10px;
  --r-sm:10px;
  --r-lg:20px;
  --nav-h:78px;
  --maxw:430px;
  --ff:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}

html[data-theme="dark"]{
  color-scheme:dark;
  --stage:#080D0E;
  --bg:#0E1618;
  --surface:#16232A;
  --surface-2:#111C20;
  --surface-3:#1D2E34;
  --border:#26383E;
  --border-strong:#3A5056;
  --text:#E9F1EE;
  --text-2:#93A8A8;
  --text-3:#789093;
  --accent:#E8A552;
  --accent-soft:#312719;
  --accent-text:#F2B76D;
  --ok:#6FB79A;
  --ok-soft:#173129;
  --warn:#E8A552;
  --warn-soft:#312719;
  --alert:#E0755F;
  --alert-soft:#351F1C;
  --info:#93A8A8;
  --info-soft:#16232A;
  --button-bg:#E9F1EE;
  --button-label:#0E1618;
  --shadow-lg:0 30px 80px rgba(0,0,0,.5);
}

html[data-theme="light"]{color-scheme:light}

body{
  background:var(--stage);
  color:var(--text);
  font-family:var(--ff);
  font-size:14px;
  line-height:1.45;
  letter-spacing:0;
  min-height:100vh;
}
html,body{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}

::selection{background:color-mix(in srgb,var(--accent) 38%,transparent)}

h1,h2,h3,h4{font-family:var(--ff);color:var(--text);letter-spacing:-.02em}
h1{font-size:29px;font-weight:700;line-height:1.16}
h2{font-size:21px;font-weight:600;line-height:1.2}
h3{font-size:17px;font-weight:500;line-height:1.25}
h4{font-size:15px;font-weight:600;line-height:1.25}
p{margin:0 0:.8em}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}

#app{
  max-width:var(--maxw);
  min-height:calc(100vh - 104px);
  margin:0 auto;
  padding:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
  background:var(--bg);
}

.topbar{
  position:sticky;
  top:0;
  z-index:40;
  max-width:var(--maxw);
  min-height:104px;
  margin:0 auto;
  padding:22px 20px 14px;
  display:flex;
  align-items:flex-start;
  gap:12px;
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  border:0;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.top-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.topbar h1{
  margin:0;
  font-size:29px;
  font-weight:700;
  line-height:1.16;
  letter-spacing:-.02em;
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
}
.topbar .sub{
  display:block;
  order:2;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
  letter-spacing:.09em;
  color:var(--text-2);
}
.urgent-btn,.close-btn{
  flex:0 0 auto;
  min-height:40px;
  padding:0 11px;
  border:1px solid var(--border-strong);
  border-radius:10px;
  background:transparent;
  color:var(--text-2);
  font:600 11px/1 var(--ff);
  letter-spacing:.06em;
  text-transform:uppercase;
}
.urgent-btn{margin-top:2px;color:var(--alert);border-color:color-mix(in srgb,var(--alert) 55%,var(--border))}

.view{
  padding:0 20px 32px;
  background:var(--bg);
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

nav.tabs{
  position:fixed;
  left:50%;
  right:auto;
  bottom:0;
  width:min(100%,var(--maxw));
  transform:translateX(-50%);
  z-index:50;
  padding:0 8px env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  border-top:1px solid var(--border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
nav.tabs .inner{max-width:none}
nav.tabs button{
  position:relative;
  height:var(--nav-h);
  min-height:48px;
  padding:9px 2px 13px;
  gap:5px;
  color:var(--text-2);
  font-size:10px;
  font-weight:600;
  letter-spacing:0;
}
nav.tabs button svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
}
nav.tabs button[aria-current="page"]{color:var(--text)}
nav.tabs button[aria-current="page"]::after{
  content:"";
  position:absolute;
  bottom:7px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--accent);
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin:0 0 12px;
  box-shadow:none;
}
.card.tight{padding:12px}
.card.flat{background:var(--surface-2);box-shadow:none}
.card-head{gap:8px;margin-bottom:10px}
.title-with-icon{display:inline-flex;align-items:center;gap:8px}
.title-with-icon svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:var(--text-2);
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.section-label{
  margin:20px 0 9px;
  color:var(--text-2);
  font-size:11px;
  font-weight:600;
  line-height:1.2;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.day-label{margin-top:5px}
.muted{color:var(--text-2)}
.tiny{font-size:13px;line-height:1.5}
.xtiny{font-size:11px;line-height:1.45;color:var(--text-2)}
hr.sep{margin:14px 0;border-color:var(--border)}

.btn{
  min-height:52px;
  padding:0 16px;
  border:1px solid var(--border-strong);
  border-radius:10px;
  background:var(--button-bg);
  color:var(--button-label);
  font-size:15px;
  font-weight:600;
  box-shadow:none;
}
.btn.primary{background:var(--button-bg);border-color:var(--button-bg);color:var(--button-label)}
html[data-theme="dark"] .btn.primary{color:var(--button-label)}
.btn.ghost{background:transparent;border-color:var(--border-strong);color:var(--text)}
.btn.sm{min-height:40px;padding:0 13px;font-size:13px}
.btn.danger{background:transparent;color:var(--alert);border-color:var(--alert)}
.btn-row{gap:8px}

label.fl{margin:0 0 7px;font-size:13px;font-weight:600;color:var(--text)}
input[type=text],input[type=number],input[type=date],select,textarea{
  min-height:46px;
  padding:11px 12px;
  border:1px solid var(--border-strong);
  border-radius:10px;
  background:var(--surface);
  color:var(--text);
  font:14px/1.3 var(--ff);
  accent-color:var(--accent);
}
textarea{min-height:92px;line-height:1.45}
.field{margin-bottom:14px}
.grid2{gap:10px}

.stepper{gap:12px}
.stepper .val{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:30px;
  font-weight:600;
  color:var(--text);
}
.stepper button{
  width:46px;
  height:46px;
  border:1px solid var(--border-strong);
  border-radius:10px;
  background:transparent;
  color:var(--text);
}
.flash-card:has([data-k="hf"][data-v="0"]:focus-visible),
.flash-card:has(.stepper button:focus-visible){border-color:var(--accent)}

.checkin-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:12px;
}
.checkin-grid .card{
  min-height:154px;
  margin:0;
  padding:12px;
  display:flex;
  flex-direction:column;
}
.checkin-grid .card.sel{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent),0 0 16px -4px var(--accent);
}
.checkin-grid .card-head{margin-bottom:8px}
.checkin-grid h3,.checkin-grid label.fl{font-size:13px;font-weight:600}
.checkin-grid .title-with-icon{align-items:flex-start}
.checkin-grid .title-with-icon svg{flex:0 0 auto}
.flash-card .stepper{gap:5px;margin:auto 0}
.flash-card .stepper button{width:40px;height:40px}
.flash-card .stepper .val{font-size:24px}
.flash-card .btn-row{gap:5px!important;margin-top:8px!important;flex-wrap:nowrap}
.flash-card .btn.sm{min-width:0;min-height:40px;padding:0 7px;font-size:11px}
.night-card .scale{margin:auto 0 0}
.night-card .scale-legend{margin-bottom:1px}

.scale{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:0;
  width:100%;
}
.scale button.scale-choice{
  flex:1 1 0;
  min-width:30px;
  min-height:40px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--text-2);
}
.scale button.scale-choice[aria-pressed="true"]{background:transparent;color:var(--accent)}
.scale-dot{
  width:12px;
  height:12px;
  display:block;
  border:1.5px solid var(--accent);
  border-radius:50%;
  background:transparent;
  transition:transform .15s ease,box-shadow .15s ease;
}
.scale-dot.fill-1{background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:transparent}
.scale-dot.fill-2{background:color-mix(in srgb,var(--accent) 50%,transparent);border-color:transparent}
.scale-dot.fill-3{background:color-mix(in srgb,var(--accent) 75%,transparent);border-color:transparent}
.scale-dot.fill-4{background:var(--accent);border-color:transparent}
.scale-dot.on{
  transform:scale(1.28);
  box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent);
}
.scale-legend{margin-top:1px}

}

<p class="tiny">The BMS adds that the overall mortality risk–benefit ratio favours both unopposed and combined therapy in population-risk women, and that combined therapy is not associated with increased breast cancer <i>mortality</i>. The Menopause Society frames the risk as under one additional case per 1,000 women per year.</p>
<p class="xtiny">You may see a much larger figure (+20 per 1,000 over 5 years) in a 2026 family-medicine editorial. We could not reconcile its denominators with the three independent sources that converge on +8 to +10, so we use the latter.</p>
</div></details>

<details class="acc"><summary>Route matters: patch/gel vs tablet</summary><div>
<p>This is one of the few places where US and UK bodies agree completely.</p>
<ul class="tick">
  <li><b>Blood clots:</b> NICE — transdermal <b>not increased</b>; oral <b>increased</b>. The BMS says transdermal shows no increased risk versus non-users.</li>
  <li><b>Stroke:</b> transdermal unlikely to increase risk; oral risk increases — more with higher dose, longer duration, older age at start, and in Black populations.</li>
  <li>NICE: <i>consider transdermal rather than oral for anyone at increased clot risk, including BMI over 30.</i></li>
</ul>
<p><b>BMS reasons to choose transdermal:</b> preference, poor response to tablets, gut absorption problems, previous clot, BMI over 30, migraine, liver enzyme-inducing medication, gallbladder disease. Transdermal is also preferred where libido matters, because it has minimal effect on SHBG so free testosterone is preserved.</p>
</div></details>

<details class="acc"><summary>If you have a uterus: progestogen is not optional</summary><div>
<p>The endometrial cancer numbers above make the stakes concrete: unopposed oestrogen for 10 years at ages 60–69 gives <b>+48 cases per 1,000</b>.</p>
<ul class="tick">
  <li><b>Continuous combined</b> (daily progestogen) <b>decreases</b> endometrial cancer risk. <b>Sequential</b> (12–14 days a month) may slightly increase it, especially with longer use or fewer progestogen days.</li>
  <li>A <b>52 mg levonorgestrel IUD</b> is an accepted way to provide the protection.</li>
  <li><b>No progestogen is needed</b> with low-dose <i>vaginal</i> oestrogen.</li>
  <li>Review at <b>3 months</b> after starting, then annually.</li>
</ul>
<div class="callout warn"><span class="ctitle">A live disagreement, presented as such</span>
The BMS says micronised progesterone and dydrogesterone carry lower breast cancer and clot risk than synthetic progestogens. <b>NICE says the evidence is insufficient to distinguish them</b>, and the BMS has publicly criticised NICE for excluding the French E3N cohort data. This is genuinely unsettled — worth raising with your clinician rather than treating either position as fact.</div>
</div></details>

<details class="acc"><summary>Who should not use systemic hormone therapy</summary><div>
<p>The Menopause Society lists: breast cancer, uterine cancer, <b>unexplained uterine bleeding</b>, liver disease, history of blood clots, cardiovascular disease. A 2026 family-medicine review adds uncontrolled hypertension and oestrogen-sensitive neoplasia.</p>
<p><b>A US/UK difference in tone:</b> NICE routes rather than refuses. For a personal or high-risk breast cancer history, or established heart disease or stroke, NICE says the option should be discussed and offered if appropriate <b>by a clinician with menopause expertise</b> (off-label). The UK is more permissive with specialist oversight.</p>
<p><b>Not a contraindication:</b> migraine with aura. See the migraine note in the symptom library.</p>
</div></details>

<details class="acc"><summary>Vaginal oestrogen — the clearest good news in the field</summary><div>
<p>Systemic absorption is minimal: blood oestradiol with a low-dose ring runs 5–10 pg/mL, and with the 10 µg tablet 3–11 pg/mL — <b>within the normal postmenopausal range</b>.</p>
<ul class="tick">
  <li><b>Strong Recommendation</b> in the 2025 multi-society guideline for vulvovaginal irritation, dryness and painful sex.</li>
  <li>It <b>does not increase</b> the risk of endometrial hyperplasia with atypia or endometrial cancer.</li>
  <li>NICE: offer it, review regularly — "serious adverse effects are very rare." Form (cream, gel, tablet, pessary, ring) is your choice.</li>
  <li>Typical pattern: daily for 2 weeks, then 1–3×/week for creams, 2×/week for tablets; rings replaced every 90 days.</li>
  <li><b>No progestogen needed.</b></li>
  <li><b>After breast cancer:</b> non-hormonal moisturisers and lubricants first; vaginal oestrogen may then be considered within multidisciplinary shared decision-making. The 2025 guideline states clinicians should inform patients of the <i>absence</i> of evidence linking low-dose vaginal oestrogen to breast cancer development.</li>
</ul>
</div></details>

<details class="acc"><summary>Non-hormonal prescription options</summary><div>
<p class="tiny">From the Menopause Society 2023 non-hormone position statement. Level I = strongest evidence tier.</p>
<div class="tw"><table>
<thead><tr><th>Option</th><th>Level</th><th>What the trials showed</th></tr></thead><tbody>
<tr><td><b>Paroxetine 7.5 mg</b></td><td>I</td><td>Improved severity and frequency up to 24 months; no weight gain or libido effect reported. FDA-approved for this use.</td></tr>
<tr><td><b>Escitalopram 10–20 mg</b></td><td>I</td><td>Reductions comparable to oestradiol 0.5 mg in pooled analysis. Off-label.</td></tr>
<tr><td><b>Venlafaxine 75 mg</b></td><td>I</td><td>1.8 fewer hot flashes/day than placebo. Off-label.</td></tr>
<tr><td><b>Desvenlafaxine</b></td><td>I</td><td>25–69% reductions across meta-analyses. Off-label.</td></tr>
<tr><td><b>Gabapentin 900 mg/day</b></td><td>I</td><td>Improved frequency and severity; 2,400 mg compared favourably to conjugated oestrogens. Off-label.</td></tr>
<tr><td><b>Oxybutynin 2.5–15 mg</b></td><td>I–II</td><td>Significantly improved moderate–severe symptoms across multiple trials. Off-label. Note it is an anticholinergic — the same class caution described in the sleep module applies.</td></tr>
<tr><td>Stellate ganglion block</td><td>II–III</td><td>Procedural; 21% reduction on physiologic monitoring in one sham-controlled trial.</td></tr>
</tbody></table></div>
<p><b>Not recommended</b> by the same statement: clonidine, pregabalin, suvorexant.</p>
<div class="callout warn"><span class="ctitle">US and UK differ here</span>
NICE says: <i>do not routinely offer SSRIs, SNRIs or clonidine as first-line treatment for vasomotor symptoms alone.</i> The Menopause Society lists SSRIs/SNRIs as recommended, Level I. Much of this is about positioning — NICE offers hormone therapy first — but the surface guidance genuinely conflicts.</div>

<h4>The newest class: neurokinin antagonists</h4>
<p>Neither is a hormone; both act on the KNDy neuron pathway in the brain's thermoregulatory centre.</p>
<p><b>Fezolinetant</b> (Veozah) — FDA-approved 2023. In SKYLIGHT 2, from a baseline of ~11–12 moderate-to-severe episodes/day, the 45 mg dose gave 2.53 fewer per day than placebo at 12 weeks (−64% from baseline). In the UK, NICE recommended it on the NHS in March 2026 for people for whom hormone therapy is unsuitable.</p>
<div class="callout alert"><span class="ctitle">Fezolinetant carries a boxed warning for liver injury</span>
<p>Required liver blood tests: <b>baseline before starting, monthly for the first 3 months, then at months 6 and 9</b>. It should not be started if ALT, AST or bilirubin is at or above twice the upper limit of normal.</p>
<p><b>Stop it and contact a clinician</b> for: unusual tiredness, nausea, vomiting, unusual itching, light-coloured stools, dark urine, yellowing of the eyes or skin, abdominal swelling, or right-upper abdominal pain.</p></div>
<p><b>Elinzanetant</b> (Lynkuet) — blocks both NK1 and NK3. Approved in the <b>UK first, 10 July 2025</b>, then the US on 24 October 2025. In the OASIS trials, about 3 fewer episodes/day than placebo at weeks 4 and 12, with <b>over 80% achieving at least a 50% reduction by week 26</b>, sustained to 52 weeks. Its differentiator is statistically significant improvement in <b>sleep disturbance</b> and menopause-related quality of life. Common side effects: headache, fatigue, sleepiness.</p>
<p class="xtiny">We could not verify whether elinzanetant carries a liver-monitoring requirement, so we state nothing either way — check the current prescribing information with your clinician.</p>
</div></details>

<details class="acc"><summary>Testosterone — one evidence-based use</summary><div>
<p>From the Global Consensus Position Statement, endorsed by the Endocrine Society, the International Menopause Society and the Menopause Society:</p>
<ul class="tick">
  <li>The <b>only</b> evidence-based indication is <b>hypoactive sexual desire disorder in postmenopausal women</b>, after a full biopsychosocial assessment.</li>
  <li><b>Effect size:</b> on average about <b>one additional satisfying sexual event per month</b> over placebo, plus improvements in desire, arousal, orgasm and sexual distress.</li>
  <li><b>Not supported:</b> cognition or dementia prevention, general wellbeing, mood, bone density, muscle, or use in premenopausal women.</li>
  <li><b>Not recommended:</b> oral formulations (adverse lipid effects), pellets or high-dose injections (supraphysiological levels), compounded "bioidentical" preparations.</li>
  <li><b>Monitoring:</b> baseline level, repeat at 3–6 weeks, then every 6 months. <b>Discontinue if no benefit by 6 months.</b></li>
  <li>At physiological doses: mild acne and some extra facial or body hair. No voice change, hair loss or clitoral enlargement. Safety data don't extend beyond 24 months.</li>
</ul>
<p><b>Access differs sharply.</b> In the US <b>no testosterone product is FDA-approved for women</b> — use is off-label, typically a fraction of a male gel. In the UK, NICE says consider testosterone if hormone therapy alone isn't effective, and the BMS suggests considering it after removal of both ovaries.</p>
</div></details>

<details class="acc"><summary>Compounded "bioidentical" hormones — why three bodies say no</summary><div>
<div class="callout warn"><span class="ctitle">The distinction that gets deliberately blurred</span>
<b>"Bioidentical" is not the same as "compounded."</b> FDA-approved bioidentical products exist — 17β-oestradiol, micronised progesterone — and they are regulated, dose-verified and sterile. The objection is to <b>custom compounding</b>, not to the molecules.</div>
<ul class="tick">
  <li><b>Menopause Society:</b> compounded preparations carry "safety concerns, such as minimal government regulation and monitoring, overdosing and underdosing, presence of impurities and lack of sterility"; they are not safer or more effective than approved products.</li>
  <li><b>National Academies (2020):</b> the range of possible combinations makes bioavailability undeterminable, so "an accurate characterization of the safety and effectiveness of cBHT preparations is not possible." Compounded testosterone pellets produced levels <b>exceeding the normal female range</b>, with a coefficient of variation of about 42%.</li>
  <li><b>Saliva and urine hormone testing</b> for diagnosis or dosing is not recommended — "unnecessary and has not been proven to be accurate nor reliable." There is no established evidence base for using hormone levels to guide dosing of menopausal symptoms.</li>
  <li>"Hormone imbalance" as a marketing rationale has no evidential support.</li>
  <li>An estimated <b>1–2.5 million US women per year</b> use unregulated compounded preparations or pellets.</li>
</ul>
</div></details>

<details class="acc"><summary>Bone loading — and when NOT to do it</summary><div>
<p>Best evidence for bone density, from a network meta-analysis of 49 trials in 3,360 postmenopausal women: <b>aerobic plus resistance combined</b> ranked first for both lumbar spine and femoral neck, ahead of either alone.</p>
<p><b>The LIFTMOR trial</b> is the famous one: postmenopausal women with low bone density did 8 months of twice-weekly, 30-minute sessions of deadlift, overhead press and back squat at <b>5 sets of 5 reps above 80–85% of maximum</b>, plus jumping chin-ups with drop landings — gaining about <b>4% spine and 2% femoral neck</b> density versus controls.</p>
<div class="callout alert"><span class="ctitle">Two caveats that get left out</span>
<p><b>1. It was fully supervised</b> by exercise scientists and physiotherapists, maximum 8 participants per instructor, with a first month of bodyweight familiarisation.</p>
<p><b>2. Participants were heavily screened.</b> Of about 568 applicants, 101 enrolled — 305 of 406 screened were excluded for contraindications. <b>This is not a self-guided home programme.</b> We could not obtain the trial's official adverse-event table, and secondary sources report injuries in people attempting it unsupervised.</p></div>
<h4>Gate the intensity by your bone status</h4>
<div class="tw"><table>
<thead><tr><th>Situation</th><th>Approach</th></tr></thead><tbody>

<p class="tiny">The UK "Strong, Steady and Straight" consensus deliberately counterbalances fear-based messaging: physical activity is not associated with significant harm including vertebral fracture, and people with osteoporosis should be encouraged to do <i>more</i> rather than less. Both things are true — the specifics are what keep you safe.</p>
</div></details>

<details class="acc"><summary>Balance & fall prevention</summary><div>
<p>The US Preventive Services Task Force gives exercise interventions a <b>Grade B</b> for preventing falls in community-dwelling adults 65+ at increased risk. Across 29 trials, falls fell about <b>15%</b> (incidence rate ratio 0.85).</p>
<p><b>What the effective programmes contained:</b> gait, balance and functional training (30 of 37 trials), strength work (25 of 37), some three-dimensional movement like tai chi or dance. The commonest dose was <b>2–3 supervised group sessions a week for a year</b>.</p>
<p><b>To do at home:</b> progress from static holds (feet together, semi-tandem, single-leg — hold a counter, then a fingertip, then nothing) to dynamic work (tandem walking, heel-to-toe, head turns while walking, tai chi). Little and often beats one long session.</p>

<p>Here is the honest position: these are among the most commonly described experiences of perimenopause and they dominate social media, but <b>the research base is much thinner than for depression.</b> We could not find a quality source quantifying incident anxiety-disorder risk, irritability or "menopause rage" attributable to the transition. Any specific percentage you see is likely invented.</p>
<p>What is documented: high trait anxiety and current anxiety disorders are risk factors for perimenopausal depression, and anxiety symptoms measurably impair cognitive performance during the transition.</p>
<p><b>What that means practically:</b> the contributors we can actually identify and treat are <b>broken sleep, symptom burden, and pre-existing anxiety</b>. Those are worth attacking directly rather than waiting for the feeling to pass.</p>
</div></details>

<details class="acc"><summary>Brain fog — and why it's reassuring</summary><div>
<p>See the symptom library for the full detail. The headline: in SWAN, women lost their usual practice-related improvement on memory and processing-speed tasks during perimenopause — and <b>regained it in early postmenopause</b>. The perimenopausal dip appears temporary.</p>
<p>Objective verbal memory decline emerged only after about <b>age 58</b>. Processing speed is the domain most affected, and it declines faster in women with cardiovascular risk factors.</p>
<p><b>Modifiable levers:</b> sleep, mood, blood pressure, lipids, glucose, activity. <b>Not</b> hormone therapy or testosterone, neither of which is indicated for cognition.</p>
<div class="callout warn"><span class="ctitle">Worth an evaluation</span>
Getting lost in familiar places · other people noticing your word-finding · trouble managing money or medication · steady worsening rather than fluctuation.</div>
</div></details>

<details class="acc"><summary>Techniques with actual evidence</summary><div>
<h4>Slow-paced breathing ${EV.moderate}</h4>
<p>Meta-analysis of randomised trials: <b>stress g = −0.35, anxiety g = −0.32, depression g = −0.40</b> — small-to-medium effects. Ten of twelve studies used <b>slow</b>-paced breathing and were significant; the two using fast-paced breathing were not. Worked individually, in groups, remotely and in person. No serious adverse events. The authors explicitly warn against "miscalibration between hype and evidence."</p>
<p>The mechanistic target is about <b>6 breaths per minute</b> — roughly 5 seconds in, 5 seconds out. There's a timer in Tools.</p>
<div class="callout alert"><span class="ctitle">The distinction most apps get wrong</span>
<b>Paced breathing is rated Level I NOT recommended for hot flashes</b> — larger trials found it no better than shallow breathing or usual care. So: breathe slowly for anxiety and stress, where it has evidence. Don't be told it stops hot flashes.</div>
<h4>Progressive muscle relaxation ${EV.moderate}</h4>
<p>Systematic review of 46 publications across 16 countries, over 3,400 adults: supportive results for stress (24 studies), anxiety (21) and low mood (11), with effect sizes ranging from small to very large. Sessions of <b>5–28 minutes</b> worked, and <b>session length didn't significantly affect outcomes</b> — so a short one counts. Effects improved when combined with music, mindfulness or deep breathing. There's a guided 10-minute sequence in Tools.</p>
<h4>Mindfulness / MBSR ${EV.moderate}</h4>
<p>Read the split carefully. Meta-analysis of 13 trials in 1,138 menopausal women: <b>stress significantly reduced (SMD −0.84)</b>; anxiety and depression not significant. A better-designed single trial (197 women, 8 weeks × 2.5 h, versus an active education control) found a real benefit on total symptom score (d = −0.49) <b>driven by the anxiety and depression subscales</b> — and <b>no effect on vasomotor, somatic or urogenital symptoms</b>.</p>
<p>So: mindfulness for stress and psychological symptoms, yes, honestly hedged. Mindfulness for hot flashes, no.</p>
<h4>Behavioural activation</h4>
<p>Doing valued things <i>before</i> you feel like it, rather than waiting for motivation. It's a core component of the CBT protocols the perimenopausal depression guideline endorses — which is how we frame it, rather than quoting a standalone effect size we couldn't verify.</p>
</div></details>

<details class="acc"><summary>Cortisol: what's real and what's being sold to you</summary><div>
<div class="callout alert"><span class="ctitle">"Adrenal fatigue" does not exist</span>
A systematic review screened 3,470 articles and included 58 studies using cortisol awakening response, salivary rhythms, dexamethasone suppression and ACTH testing. Findings were "almost systematically conflicting." The authors' conclusion is quotable: <b>"adrenal fatigue does not exist"</b> — there is "no substantiation that 'adrenal fatigue' is an actual medical condition." No endocrinology society recognises it.</div>
<p><b>Also not supported:</b> "cortisol face," cortisol detoxes, adaptogen stacks marketed on cortisol, and at-home salivary cortisol panels. Genuine cortisol excess — Cushing syndrome — is a rare, properly diagnosed endocrine disease with a specific constellation of findings. It is not something you assess from a selfie.</p>
<p><b>The useful position:</b> chronic stress is real and worth managing. Manage it with things that have trial evidence — CBT, exercise, slow breathing, progressive muscle relaxation, sleep repair — rather than testing or supplementing a hormone.</p>
</div></details>`;
