<h4>Fibre</h4>
<p>Adequate intake is <b>21 g/day for women 51+</b> (25 g for 31–50), or 14 g per 1,000 calories. Average US intake is about 17 g — roughly half of some targets. Increase gradually; going fast causes bloating. Some menopause reviews suggest 30–45 g, but that's narrative-review advice rather than a formal recommendation.</p>
<p class="tiny"><b>Ultra-processed food:</b> in adults over 50, the highest versus lowest intake quintile was associated with 1.5× the odds of osteopenia or osteoporosis. Observational — diet quality tracks with bone outcomes, which isn't the same as causing them.</p>
<p class="tiny"><b>The "estrobolome":</b> mechanistically interesting, and there is no randomised trial showing a microbiome intervention improves menopausal symptoms. Be sceptical of probiotics marketed on this basis.</p>

<details class="acc"><summary>Alcohol — the real reason to cut back</summary><div>
<div class="callout alert"><span class="ctitle">Breast cancer, not hot flashes</span>
<p>There is no safe threshold; risk begins at the first drink. Pooled relative risk: <b>1.05 at half a drink a day, 1.10 at one, 1.18 at two, 1.22 at three.</b> The 2025 National Academies review concluded that up to one drink a day in women is associated with about <b>10% higher</b> breast cancer risk. The Million Women Study found ~12% higher risk per additional daily drink. Alcohol is a Group 1 carcinogen.</p>
<p>US dietary guidance published in January 2026 moved away from advising people to drink in moderation and toward advising them to <b>drink less</b>.</p></div>
<p>For context from the hormone-therapy risk table: alcohol at 4–6 units/day adds about <b>8</b> extra breast cancers per 1,000 women aged 50–59 over five years — the same order as combined hormone therapy, which women agonise over far more.</p>
<p><b>On alcohol, caffeine and spicy food as hot flash triggers:</b> the Menopause Society states there are <i>no clinical trials</i> assessing whether avoiding triggers relieves symptoms. The most-cited caffeine finding is cross-sectional, and its own authors said they couldn't advise patients without further study. Cut alcohol for breast cancer risk, sleep quality and calories — those are solid. Treat trigger-hunting as a personal experiment, and use the 28-day removal-and-reintroduction test in Tools to do it properly.</p>
</div></details>

<details class="acc"><summary>Energy needs, and why crash dieting backfires</summary><div>
<p>See <b>Weight & body composition</b> for the full picture. The short version: adjusted resting energy expenditure declines with <b>age</b>, not menopausal status (7 kcal/day difference, p=0.78). Because resting metabolism tracks lean mass, <b>losing muscle is the actual mechanism by which restriction lowers your metabolism</b>.</p>
<p><b>Defensible approach:</b> a modest deficit of roughly 300–500 kcal/day, protein at 1.2 g/kg or above, resistance training 2–3×/week, aiming for <b>0.5–1 kg (1–2 lb) per week</b>. A 5% loss already improves blood pressure, lipids and glucose, and slower loss predicts better maintenance.</p>
<p class="tiny">We deliberately publish no menopause-specific calorie number. No guideline supports one, and "1,200 calories" is a number from nowhere.</p>
</div></details>

<details class="acc"><summary>Iron, B12, sodium — small things worth getting right</summary><div>
<ul class="tick">
  <li><b>Iron:</b> the RDA drops from 18 mg/day (ages 19–50) to <b>8 mg/day at 51+</b>. Older adults are more likely to be in chronic positive iron balance than deficient. <b>Don't take routine iron once periods stop</b> — and iron deficiency after menopause should be investigated medically, not supplemented away, because it can signal gastrointestinal bleeding.</li>
  <li><b>B12:</b> 2.4 µg/day. Status is impaired by atrophic gastritis, metformin, acid-reducing medication and fully plant-based diets — worth asking about if any apply.</li>
  <li><b>Magnesium:</b> RDA 320 mg/day. Claims that it fixes hot flashes, anxiety or cramps in menopause are weak at best.</li>
  <li><b>Sodium:</b> the lever with real blood-pressure evidence is a DASH-style, reduced-sodium pattern.</li>
</ul>
</div></details>`;

<details class="acc"><summary>Specific conditions</summary><div>
<h4>Adult acne</h4>
<p>Affects around 15% of women, driven by relative androgen excess plus falling oestrogen; more truncal and lower-face, milder but on more reactive skin, so more lingering redness and marks.</p>
<p><b>Spironolactone has good trial evidence</b> — the SAFA trial (50 mg/day rising to 100 mg, 342 women): participant-reported improvement <b>82% versus 63%</b> at 24 weeks, with headache more common (20% vs 12%) and no serious adverse events. Note the mean age in that trial was 29 — extrapolating to your 50s is mechanistically reasonable but not directly tested. Prescription only, and <b>not for use in pregnancy or while trying to conceive</b>.</p>
<h4>Melasma</h4>
<p>Sun protection is foundational and non-negotiable. Tranexamic acid (oral, topical or intradermal) has meta-analytic support, and combination regimens consistently reduce severity. We're not publishing concentrations or doses — this one really needs a dermatologist.</p>
<h4>Rosacea</h4>
<p>Often worsens through menopause: impaired barrier, more vascular reactivity, microbiome shifts including more <i>Demodex</i>, and UV damage — producing more persistent redness, flushing and visible vessels, particularly overlapping with hot flashes.</p>
<h4>Itch and crawling sensations</h4>
<p>Partly mechanical (dryness), partly neuroinflammatory — oestrogen deficiency is associated with increased skin nerve fibre density and upregulated type-2 cytokine pathways, which heightens itch sensitivity. Vulvar itching and soreness reflect epithelial thinning, less lubrication and more fragile blood vessels — and respond to the treatments in the Intimacy module.</p>
<p class="xtiny">On formication (the crawling-skin sensation): widely reported, and we found no quality source. We won't quantify it.</p>
<h4>Facial hair</h4>
<p>Laser, electrolysis, topical eflornithine and anti-androgens all exist and are clinician-directed. <b>Rapid-onset hair growth or deepening voice needs prompt evaluation</b> — that pattern can signal an androgen-producing tumour.</p>
</div></details>

<details class="acc"><summary>Hair thinning</summary><div>
<p>Female pattern hair loss is common after menopause — one 2026 dermatology review puts it at around half of postmenopausal women, though we could not reach the underlying prevalence studies, so hold that figure loosely. The growth phase shortens, follicles miniaturise, density drops. Risk factors: genetics, age, time since menopause, higher BMI, more scalp oil.</p>
<h4>What works — from a 2026 clinical review</h4>
<ul class="tick">
  <li><b>Topical minoxidil, first line:</b> 2% solution twice daily <b>or</b> 5% foam once daily. Mean benefit 42 out of 100 on a visual analogue scale. <b>Takes 6–12 months.</b> Expect transient shedding at the start; it is a documented early effect rather than a sign it is not working.</li>
  <li><b>Oral spironolactone:</b> increased hair density in 43% of users in a systematic review. Prescription.</li>
  <li><b>Second line:</b> oral minoxidil, finasteride, low-level laser, PRP, oral contraceptives; combinations may add benefit.</li>
  <li><b>Low-level laser devices:</b> meta-analysis of 7 double-blind trials (n=607) found real benefit versus sham (SMD 1.27; in women 1.36). Protocols ran 16–26 weeks, mostly 3–4×/week. Comb and helmet forms performed similarly.</li>
  <li><b>Most of these are contraindicated in pregnancy</b> — which matters if you are still perimenopausal and could conceive.</li>
  <li><b>Screen for anxiety and depression</b> — the psychological impact of hair loss is well established and worth naming.</li>
</ul>
<div class="callout warn"><span class="ctitle">You are probably being over-tested</span>
The clinical review says investigations like ferritin and thyroid function should be <b>reserved for when an alternative diagnosis is suspected</b>, and that androgen levels are usually normal and unhelpful. It does not support routine vitamin D testing. The popular "always check ferritin, TSH, vitamin D and zinc" panel is broader than the evidence supports. What <i>does</i> warrant a workup: sudden diffuse shedding, scalp symptoms, scarring, or systemic features.</div>
<p class="tiny"><b>No oral hair supplement</b> emerged as supported in that review. Save your money.</p>
</div></details>

<details class="acc"><summary>Facial oestrogen — proceed carefully</summary><div>
<p>Topical oestrogen does increase type I and III procollagen synthesis, and studies of methyl estradiol propanoate showed improvements in hydration, laxity and dullness. Systemic hormone therapy increases skin collagen, elasticity, thickness and hydration — but it is <b>not indicated for skin alone</b>.</p>

</div></details>

<p>Women are <b>2–4× more likely</b> to have a major depressive episode during the transition and early postmenopause. Elevated depressive symptoms were found in <b>45–68% of perimenopausal</b> versus 28–31% of premenopausal women. Early perimenopause carried 1.74× the odds — 2.45× in Hispanic women. A separate 2024 meta-analysis found ~40% higher odds in perimenopause and <b>no significant elevation postmenopause</b>.</p>

<p>See the symptom library for the full detail. The headline: in SWAN, women lost their usual practice-related improvement on memory and processing-speed tasks during perimenopause — and <b>regained it in early postmenopause</b>. The perimenopausal dip appears temporary.</p>

<details class="acc"><summary>Techniques with actual evidence</summary><div>
<h4>Slow-paced breathing ${EV.moderate}</h4>
<p>Meta-analysis of randomised trials: <b>stress g = −0.35, anxiety g = −0.32, depression g = −0.40</b> — small-to-medium effects. Ten of twelve studies used <b>slow</b>-paced breathing and were significant; the two using fast-paced breathing were not. Worked individually, in groups, remotely and in person. No serious adverse events. The authors explicitly warn against "miscalibration between hype and evidence."</p>
<p>The mechanistic target is about <b>6 breaths per minute</b> — roughly 5 seconds in, 5 seconds out. There's a timer in Tools.</p>
<div class="callout alert"><span class="ctitle">The distinction most apps get wrong</span>
<b>Paced breathing is rated Level I NOT recommended for hot flashes</b> — larger trials found it no better than shallow breathing or usual care. So: breathe slowly for anxiety and stress, where it has evidence. Don't be told it stops hot flashes.</div>
<h4>Progressive muscle relaxation ${EV.moderate}</h4>
<p>Systematic review of 46 publications across 16 countries, over 3,400 adults: supportive results for stress (24 studies), anxiety (21) and low mood (11), with effect sizes ranging from small to very large. Sessions of <b>5–28 minutes</b> worked, and <b>session length didn't significantly affect outcomes</b> — so a short one counts. Effects improved when combined with music, mindfulness or deep breathing. There's a guided 10-minute sequence in Tools.</p>
<h4>Mindfulness / MBSR ${EV.moderate}</h4>
<p>Read the split carefully. Meta-analysis of 13 trials in 1,138 menopausal women: <b>stress significantly reduced (SMD −0.84)</b>; anxiety and depression not significant. A better-designed single trial (197 women, 8 weeks × 2.5 h, versus an active education control) found a real benefit on total symptom score (d = −0.49) <b>driven by the anxiety and depression subscales</b> — and <b>no effect on vasomotor, somatic or urogenital symptoms</b>.</p>
<p>So: mindfulness for stress and psychological symptoms, yes, honestly hedged. Mindfulness for hot flashes, no.</p>
<h4>Behavioural activation</h4>
<p>Doing valued things <i>before</i> you feel like it, rather than waiting for motivation. It's a core component of the CBT protocols the perimenopausal depression guideline endorses — which is how we frame it, rather than quoting a standalone effect size we couldn't verify.</p>
</div></details>

<details class="acc"><summary>Cortisol: what's real and what's being sold to you</summary><div>
<div class="callout alert"><span class="ctitle">"Adrenal fatigue" does not exist</span>
A systematic review screened 3,470 articles and included 58 studies using cortisol awakening response, salivary rhythms, dexamethasone suppression and ACTH testing. Findings were "almost systematically conflicting." The authors' conclusion is quotable: <b>"adrenal fatigue does not exist"</b> — there is "no substantiation that 'adrenal fatigue' is an actual medical condition." No endocrinology society recognises it.</div>
<p><b>Also not supported:</b> "cortisol face," cortisol detoxes, adaptogen stacks marketed on cortisol, and at-home salivary cortisol panels. Genuine cortisol excess — Cushing syndrome — is a rare, properly diagnosed endocrine disease with a specific constellation of findings. It is not something you assess from a selfie.</p>
<p><b>The useful position:</b> chronic stress is real and worth managing. Manage it with things that have trial evidence — CBT, exercise, slow breathing, progressive muscle relaxation, sleep repair — rather than testing or supplementing a hormone.</p>
</div></details>`;

<li>Any prevalence figure for menopausal "rage" or irritability — none exists that we could verify.</li>
<li>A menopause-specific calorie target, a pelvic floor sets-and-reps prescription attributed to Cochrane, and a severity cut-off for the symptom burden score — none is supported.</li>

<h4>A note on whose data this is</h4>
<p class="tiny">Where racial and ethnic differences are documented, this app reports them — symptom duration (10.1 years in African American women versus 4.8 in Japanese women), premature menopause prevalence (15.5% versus 4.8%), endometrial cancer incidence and mortality, and ultrasound false-negative rates. Omitting these produces content that is least accurate for the women at highest risk.</p>

<p class="tiny">On boxed warnings, SSRIs for hot flashes, testosterone access, supplement wording, micronised progesterone, and calcium and vitamin D targets. Where they conflict, this app flags both positions inline rather than picking a side silently, and where a whole section is US-specific — the preventive care checklist — setting your region in Settings adds a warning.</p>`;

/* Shared by the native preview and the bundled web app. No health events or SDKs. */
const PeriOnboarding = (() => {
  const version = 2;
  const versionV2Flow = 3;
  const finalStepFor = flowVersion => (flowVersion === versionV2Flow ? 11 : 3);
  const symptoms = [
    ['sleepq', 'Trouble sleeping'], ['energy', 'Fatigue'], ['hf', 'Hot flashes'],
    ['fog', 'Brain fog'], ['ns', 'Night sweats'], ['mood', 'Low mood'],
    ['anx', 'Anxiety'], ['joint', 'Joint pain'], ['dry', 'Dryness'],
    ['uri', 'Bladder'], ['head', 'Headache'], ['palp', 'Palpitations'],
    ['itch', 'Skin'], ['libido', 'Low libido'], ['bloating', 'Bloating'],
    ['dizzy', 'Dizziness'], ['irritable', 'Irritability'], ['overwhelmed', 'Feeling overwhelmed'],
  ].map(([key, label]) => ({ key, label }));
  const goals = [
    { key: 'understand', label: 'Understand my symptoms', reply: 'Your chosen symptoms will be front and center in each check-in.', benefit: 'Keep a simple record of how things feel, then explore changes as your record grows.' },
    { key: 'treatment', label: 'Keep track of treatment', reply: 'You can keep treatment changes alongside how you feel.', benefit: 'Add a treatment in Care when you’re ready, then follow your own experience over time.' },
    { key: 'appointment', label: 'Prepare for an appointment', reply: 'Let’s make it easier to remember what you want to discuss.', benefit: 'Your check-ins can become a focused summary to bring to your next appointment.' },
    { key: 'record', label: 'Make a little space for myself', reply: 'A small check-in, at your own pace. No perfect streak needed.', benefit: 'Keep a private record you can come back to whenever it helps.' },
  ];
  const defaults = ['sleepq', 'energy', 'hf'];
  const keys = new Set(symptoms.map(item => item.key));
  function normalizeDraft(value, flowVersion = version) {
    const source = value && typeof value === 'object' ? value : {};
    const maxStep = finalStepFor(flowVersion);
    return {
      step: Number.isInteger(source.step) ? Math.max(0, Math.min(maxStep, source.step)) : 0,
      symptoms: Array.isArray(source.symptoms) ? [...new Set(source.symptoms.filter(key => keys.has(key)))].slice(0, 6) : [],
      intent: goals.some(goal => goal.key === source.intent) ? source.intent : '',
    };
  }
  function draftFromProfile(profile) {
    if (!profile) return normalizeDraft({});
    if (profile.onboardingVersion === versionV2Flow) {
      return normalizeDraft({ step: profile.onboardingStep, symptoms: profile.pinnedSymptoms, intent: profile.intent }, versionV2Flow);
    }
    if (profile.onboardingVersion !== version) return normalizeDraft({ intent: profile?.intent });
    return normalizeDraft({ step: profile.onboardingStep, symptoms: profile.pinnedSymptoms, intent: profile.intent });
  }
  function goalFor(intent) { return goals.find(goal => goal.key === intent) || goals[0]; }
  function labelsFor(selected) { return selected.map(key => symptoms.find(item => item.key === key)?.label).filter(Boolean); }
  function profilePatch(value, complete = false, skipped = false, flowVersion = version) {
    const draft = normalizeDraft(value, flowVersion);
    const finalStep = finalStepFor(flowVersion);
    if (complete && !skipped && (!draft.symptoms.length || !draft.intent || draft.step !== finalStep)) throw new Error('Finish choosing your starting point first.');
    return {
      onboardingVersion: flowVersion,
      onboardingStep: complete ? finalStep : draft.step,
      pinnedSymptoms: complete && !draft.symptoms.length ? [...defaults] : draft.symptoms,
      intent: complete && !draft.intent ? 'understand' : draft.intent,
      ...(complete ? { onboarded: true, onboardingDeferred: skipped, firstCheckinPending: true } : {}),
    };
  }
  function parseState(serialized) {
    if (!serialized) return { v: 8, profile: {}, entries: {} };
    const value = JSON.parse(serialized);
    if (!value || !Number.isInteger(value.v) || !value.profile || typeof value.profile !== 'object' || Array.isArray(value.profile) || !value.entries || typeof value.entries !== 'object' || Array.isArray(value.entries)) throw new Error('Invalid local record.');
    return value;
  }
  function writeDraft(serialized, draft, complete = false, skipped = false, flowVersion = version) {
    const state = parseState(serialized);
    // Preview never writes entries, treatments, ratings, or medical context.
    state.profile = { ...state.profile, ...profilePatch(draft, complete, skipped, flowVersion) };
    return JSON.stringify(state);
  }
  function needsPreview(serialized) {
    const profile = parseState(serialized).profile;
    const pendingFirstCheckin = profile.firstCheckinPending === true
      && (profile.onboardingVersion === version || profile.onboardingVersion === versionV2Flow);
    return profile.onboarded !== true || pendingFirstCheckin;
  }
  return { version, versionV2Flow, symptoms, goals, defaults, normalizeDraft, draftFromProfile, goalFor, labelsFor, profilePatch, parseState, writeDraft, needsPreview };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = PeriOnboarding;

/* ---------- storage with graceful fallback ---------- */
const Store = (() => {
  const KEY = 'menocompass.v1';
  let mem = null, usingMemory = false;
  function nativeBridge(){
    return window.__MENO_NATIVE__===true && !!(window.ReactNativeWebView&&window.ReactNativeWebView.postMessage);
  }
  function postNative(serialized){
    if(!nativeBridge()) return false;
    try{
      window.ReactNativeWebView.postMessage(JSON.stringify({type:'persist-state',state:serialized}));
      return true;
    }catch(e){ return false; }
  }
  function injectedState(){
    try{
      const serialized=window.__MENO_PERSISTED_STATE__;
      if(typeof serialized!=='string'||!serialized) return null;
      window.__MENO_PERSISTED_STATE__='';
      return JSON.parse(serialized);
    }catch(e){ return null; }
  }
  function probe(){
    try{
      const t='__mc_t__'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return true;
    }catch(e){ return false; }
  }
  const ok = probe();
  if(!ok) usingMemory = true;
  return {
    get key(){ return KEY; },
    get ephemeral(){ return usingMemory&&!nativeBridge(); },
    read(){
      const injected=injectedState();
      if(injected){
        mem=injected;
        if(nativeBridge()) try{ localStorage.removeItem(KEY); }catch(e){}
        return injected;
      }
      if(nativeBridge()){
        try{ localStorage.removeItem(KEY); }catch(e){}
        return mem;
      }
      if(usingMemory) return mem;
      try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }
      catch(e){ usingMemory = true; return mem; }
    },
    write(obj){
      let serialized;
      try{ serialized=JSON.stringify(obj); }
      catch(e){ return false; }
      const nativeSaved=postNative(serialized);
      if(nativeBridge()){
        mem=obj;
        try{ localStorage.removeItem(KEY); }catch(e){}
        return nativeSaved;
      }
      if(usingMemory){ mem = obj; return nativeSaved; }
      try{ localStorage.setItem(KEY, serialized); return true; }
      catch(e){ usingMemory = true; mem = obj; return nativeSaved; }
    },
    clear(){ mem=null; try{ localStorage.removeItem(KEY); }catch(e){} }
  };
})();

function postNativeEvent(type, attributes){
  if(window.__MENO_NATIVE__!==true || !window.ReactNativeWebView) return false;
  try{
    const message=Object.assign({type},attributes&&typeof attributes==='object'?attributes:{});
    window.ReactNativeWebView.postMessage(JSON.stringify(message));
    return true;
  }catch(e){ return false; }
}

        actions.push({id:actionId,text,done:action.done===true});
      });
      const summary=safeText(item.summary,2000).trim();
      const nextVisit=typeof item.nextVisit==='string'&&validISODate(item.nextVisit)?item.nextVisit:'';
      if(!summary&&!actions.length&&!nextVisit) return;
      out.plans.push({id,date,summary,actions,nextVisit});
    });
    out.plans.sort((a,b)=>b.date.localeCompare(a.date));
  }
  return out;
}
function safeHealthKitSummary(raw){
  if(!plainRecord(raw)||raw.available!==true||raw.readOnly!==true) return null;
  const generatedAt=typeof raw.generatedAt==='string'&&Number.isFinite(Date.parse(raw.generatedAt))?raw.generatedAt:'';
  const lookbackDays=safeInteger(raw.lookbackDays,1,30);
  if(!generatedAt||lookbackDays==null) return null;
  const steps=plainRecord(raw.steps)?raw.steps:{}, sleep=plainRecord(raw.sleep)?raw.sleep:{}, bodyWeight=plainRecord(raw.bodyWeight)?raw.bodyWeight:{};
  const totalSteps=safeNumber(steps.total,0,10000000), dailySteps=safeNumber(steps.dailyAverage,0,1000000);
  const totalSleep=safeNumber(sleep.totalHours,0,720), nightlySleep=safeNumber(sleep.nightlyAverageHours,0,24), trackedNights=safeInteger(sleep.trackedNights,0,31)||0;
  const latestKilograms=safeNumber(bodyWeight.latestKilograms,20,500);
  const recordedAt=typeof bodyWeight.recordedAt==='string'&&Number.isFinite(Date.parse(bodyWeight.recordedAt))?bodyWeight.recordedAt:null;
  const warnings=Array.isArray(raw.warnings)?raw.warnings.map(item=>safeText(item,80)).filter(Boolean).slice(0,10):[];
  return {
    available:true,readOnly:true,generatedAt,lookbackDays,
    hasAnyData:raw.hasAnyData===true,
    steps:{total:totalSteps,dailyAverage:dailySteps},
    sleep:{totalHours:totalSleep,nightlyAverageHours:nightlySleep,trackedNights},
    bodyWeight:{latestKilograms,recordedAt},warnings
  };
}
function safeScore(raw){
  if(!plainRecord(raw)) return null;
  const type=safeEnum(raw.type,['phq9','gad7'],null), date=safePastDate(raw.date);
  const max=type==='phq9'?27:type==='gad7'?21:null;
  const score=max==null?null:safeInteger(raw.score,0,max);
  if(!type || !date || score==null) return null;
  const band=type==='phq9'
    ? (score<5?'minimal':score<10?'mild':score<15?'moderate':score<20?'moderately severe':'severe')
    : (score<5?'minimal':score<10?'mild':score<15?'moderate':'severe');
  return {date,type,score,band};
}
function safeTrigger(raw){
  if(!plainRecord(raw)) return null;
  const start=safePastDate(raw.start); if(!start) return null;
  const item=safeEnum(raw.item,['Alcohol','Caffeine','Spicy food','Sugar','Late meals','Hot drinks','Something else'],null);
  if(!item) return null;
  const status=safeEnum(raw.status,['running','stopped','completed'],raw.active===true?'running':'stopped');
  const ended=safePastDate(raw.ended);
  const validEnded=ended&&ended>=start?ended:'';
  const finalStatus=validEnded ? (status==='completed'?'completed':'stopped') : status;
  const out={active:finalStatus==='running'&&raw.active===true&&!validEnded,status:finalStatus,item,start};
  if(validEnded) out.ended=validEnded;
  return out;
}
function validateBackup(raw){
  if(!plainRecord(raw) || !Number.isInteger(raw.v) || raw.v<1 || raw.v>SCHEMA_V
      || !plainRecord(raw.profile) || !plainRecord(raw.entries)){
    throw new Error('Invalid backup');

}
let saveTimer=null, dirty=false;
function save(now){
  if(now){ clearTimeout(saveTimer); dirty=false; Store.write(DB); return; }
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ dirty=false; Store.write(DB); }, 250);
}
/* Flush only a pending debounced write. Deliberately does NOT write
   unconditionally on unload — that would let a stale tab overwrite
   changes made in another tab. */
function flush(){
  if(dirty){ clearTimeout(saveTimer); dirty=false; Store.write(DB); }
}

/* ---------- date helpers ---------- */
function todayISO(){ const d=new Date(); return iso(d); }
function iso(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function validISODate(s){
  if(typeof s!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d=parseISO(s);
  return !isNaN(d.getTime()) && iso(d)===s;
}
function pastOrTodayISO(s){ return validISODate(s) && s<=todayISO(); }
function fmtDay(s){
  const d=parseISO(s), t=todayISO();
  if(s===t) return 'Today';
  if(s===addDays(t,-1)) return 'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function fmtLong(s){ return parseISO(s).toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric', year:'numeric'}); }
const DOW=['S','M','T','W','T','F','S'];

/* ---------- units ---------- */
const U = {
  get imp(){ return DB.profile.units==='imperial'; },
  wLabel(){ return this.imp?'lb':'kg'; },
  lLabel(){ return this.imp?'in':'cm'; },
  wOut(kg){ if(kg==null) return null; return this.imp ? kg*2.20462 : kg; },
  wIn(v){ if(v==null||v==='') return null; return this.imp ? v/2.20462 : +v; },
  lOut(cm){ if(cm==null) return null; return this.imp ? cm/2.54 : cm; },
  lIn(v){ if(v==null||v==='') return null; return this.imp ? v*2.54 : +v; }
};
const r1 = v => v==null?null:Math.round(v*10)/10;

/* ---------- what the profile implies ----------
   Uterus and ovaries are independent: a hysterectomy can leave both ovaries,
   and both ovaries can be removed with the uterus left in place. */
function hasUterus(){ return DB.profile.uterus!=='hyst'; }
function periodsPossible(){
  return DB.profile.uterus!=='hyst' && DB.profile.uterus!=='ablation'
      && DB.profile.ovaries!=='both';
}
function surgicalMenopause(){ return DB.profile.ovaries==='both'; }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Screening records can carry the interval that matches the test a person
   actually used. That matters most for cervical and colorectal screening,
   where a date alone cannot tell us whether the next check is due in one,
   three, five or ten years. Defaults use the shortest standard interval so a
   recorded date never suppresses reminders indefinitely. */
const SCREENING_RULES = {
  mammo:    {label:'mammogram', minAge:40, maxAge:74, years:[2], defaultYears:2},
  cervical: {label:'cervical screening', minAge:21, maxAge:65, years:[3,5], defaultYears:3,
             yearsForAge:age=>age<30?[3]:[3,5]},
  colon:    {label:'colorectal screening', minAge:45, maxAge:75, years:[1,3,5,10], defaultYears:1},
  dxa:      {label:'bone density scan', minAge:65, maxAge:null, years:[5], defaultYears:5}
};
function screeningIntervals(rule, age){
  return rule&&rule.yearsForAge&&age!=null ? rule.yearsForAge(age) : (rule?rule.years:[]);
}
function screeningStatus(id, age){
  const rule=SCREENING_RULES[id];
  /* Automated due dates encode US guidance. Other regions keep the checklist
     for recording dates, but do not receive misleading US-timed reminders. */
  if(DB.profile.region!=='us' || !rule || age==null || age<rule.minAge || (rule.maxAge!=null && age>rule.maxAge)){
    return {eligible:false, due:false};
  }
  const rec=DB.screening[id]||{};
  const validLast=pastOrTodayISO(rec.last);
  const requested=+rec.intervalYears;
  const allowed=screeningIntervals(rule,age);
  const intervalYears=allowed.includes(requested) ? requested : rule.defaultYears;
  if(!validLast){
    return {eligible:true, due:true, never:true, invalid:!!rec.last, intervalYears, rule};
  }
  const elapsed=daysBetween(rec.last,todayISO());
  return {
    eligible:true,
    due:elapsed>=Math.round(intervalYears*365.25),
    never:false,
    last:rec.last,
    elapsed,
    intervalYears,
    rule
  };
}

const SYMS = [
  {k:'sleepq', n:'Sleep quality', inv:true},
  {k:'mood',   n:'Low mood'},
  {k:'anx',    n:'Anxiety / irritability'},
  {k:'fog',    n:'Brain fog'},
  {k:'joint',  n:'Joint or muscle ache'},
  {k:'dry',    n:'Vaginal dryness / discomfort'},
  {k:'uri',    n:'Bladder symptoms'},
  {k:'energy', n:'Fatigue'},
  {k:'head',   n:'Headache'},
  {k:'palp',   n:'Palpitations'},
  {k:'itch',   n:'Skin dryness / itch'},

const SCALE4 = ['None','Mild','Moderate','Severe','Very severe'];

function entry(d){
  if(!DB.entries[d]) DB.entries[d] = {sym:{}, act:{}, nut:{}, confirmed:false, draftDirty:false};
  const e = DB.entries[d];
  e.sym = e.sym||{}; e.act = e.act||{}; e.nut = e.nut||{};
  const hasSnapshot=plainRecord(e.confirmedData)&&hasEntryContent(e.confirmedData);
  e.confirmed=!!hasSnapshot;
  e.draftDirty=!!hasSnapshot&&e.draftDirty===true;
  return e;
}
function hasEntryContent(e){
  if(!plainRecord(e)) return false;
  if(e.hf!=null||e.ns!=null||e.wt!=null||e.waist!=null||e.bleed||e.notes) return true;
  if(e.rating!=null||e.wakes!=null||(Array.isArray(e.moments)&&e.moments.length)) return true;
  if(Object.keys(e.sym||{}).length) return true;
  if(e.sleepH!=null||e.inBedH!=null) return true;
  if(Object.keys(e.act||{}).length||Object.keys(e.nut||{}).length) return true;
  return false;
}
function isConfirmedEntry(d){
  const e=DB.entries[d];
  return !!(e&&plainRecord(e.confirmedData)&&hasEntryContent(e.confirmedData));
}
function confirmedEntry(d){ return isConfirmedEntry(d)?DB.entries[d].confirmedData:null; }
function markEntryDraft(d){
  const e=DB.entries[d];
  if(!e||!isConfirmedEntry(d)) return false;
  e.confirmed=true;
  e.draftDirty=true;
  return true;
}
function confirmEntry(d){
  const e=entry(d);
  const snapshot=safeEntryPayload(e);
  if(!hasEntryContent(snapshot)) return false;
  /* Build and validate the complete snapshot before swapping it in, so a
     failed confirmation cannot partly overwrite the last trusted record. */
  e.confirmedData=snapshot;
  e.confirmed=true;
  e.draftDirty=false;
  delete e.prefilledFrom;
  return true;
}
function hasData(d){ return isConfirmedEntry(d); }
function confirmedEntryDates(){ return Object.keys(DB.entries).filter(isConfirmedEntry).sort(); }
function entryDates(){ return confirmedEntryDates(); }
function rangeDates(n){
  const out=[]; const t=todayISO();
  for(let i=n-1;i>=0;i--) out.push(addDays(t,-i));
  return out;
}
function series(days, fn){
  return days.map(d=>{ const e=confirmedEntry(d); return {d, v:e?fn(e):null}; });
}
function movingAvg(arr, w){
  return arr.map((p,i)=>{
    const s=arr.slice(Math.max(0,i-w+1), i+1).filter(x=>x.v!=null).map(x=>x.v);
    return {d:p.d, v: s.length? s.reduce((a,b)=>a+b,0)/s.length : null};
  });
}
function avg(nums){ const a=nums.filter(v=>v!=null && !isNaN(v)); return a.length? a.reduce((x,y)=>x+y,0)/a.length : null; }
function sum(nums){ return nums.filter(v=>v!=null).reduce((x,y)=>x+y,0); }

/* ---------- symptom burden score ----------
   11 tracked items on the same 0-4 per-symptom structure the Menopause
   Rating Scale uses, scaled to 0-44. Deliberately NOT banded into
   severity categories: this is not the MRS item set (it excludes hot
   flashes and sleep, and adds brain fog, headache and itch), and no
   validated cut-off exists for it. It is a direction-over-time measure.
   Requires most items answered so a partial day can't read as severe. */
const BURDEN_KEYS = ['mood','anx','fog','joint','dry','uri','energy','head','palp','itch','libido'];
const BURDEN_MIN_ITEMS = 8;
function burden(e){
  if(!e||!e.sym) return null;
  const vals = BURDEN_KEYS.map(k=>e.sym[k]).filter(v=>v!=null);
  if(vals.length < BURDEN_MIN_ITEMS) return null;
  const scaled = sum(vals) / vals.length * BURDEN_KEYS.length;
  return Math.round(scaled*10)/10;
}

/* ---------- SVG charts (no dependencies) ---------- */
function lineChart(points, opt){
  opt = opt||{};
  const W=320, H=opt.h||120, PL=30, PR=6, PT=8, PB=18;
  const vals = points.filter(p=>p.v!=null).map(p=>p.v);
  if(vals.length<1) return emptyChart(opt.empty||'No data yet');
  let min = opt.min!=null?opt.min:Math.min(...vals);
  let max = opt.max!=null?opt.max:Math.max(...vals);
  if(min===max){ min-=1; max+=1; }
  const pad=(max-min)*0.12; min-=pad; max+=pad;
  if(opt.min0 && min>0) min=0;
  const x = i => PL + (W-PL-PR) * (points.length<2?0.5:i/(points.length-1));
  const y = v => PT + (H-PT-PB) * (1-(v-min)/(max-min));
  let path='', area='', started=false, lastX=null;
  points.forEach((p,i)=>{
    if(p.v==null) return;
    const cmd = started?'L':'M';
    path += cmd + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1) + ' ';
    if(!started){ area += 'M' + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1) + ' '; started=true; }
    else area += 'L' + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1) + ' ';
    lastX = x(i);
  });
  if(started && opt.area) area += 'L'+lastX.toFixed(1)+' '+(H-PB)+' L'+x(points.findIndex(p=>p.v!=null)).toFixed(1)+' '+(H-PB)+' Z';
  const ticks = [max, (max+min)/2, min];
  let g='';
  ticks.forEach(t=>{ g += '<line class="grid" x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/>'
    + '<text class="axis" x="'+(PL-4)+'" y="'+(y(t)+3).toFixed(1)+'" text-anchor="end">'+(Math.round(t*10)/10)+'</text>'; });
  let ml='';
  if(opt.ma){
    const ma = movingAvg(points, opt.ma);
    let p2='', st=false;
    ma.forEach((p,i)=>{ if(p.v==null) return; p2 += (st?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' '; st=true; });
    if(st) ml = '<path class="ln2" d="'+p2+'"/>';
  }
  const lastIdx = points.map(p=>p.v).reduce((acc,v,i)=>v!=null?i:acc,-1);
  const dot = lastIdx>=0 ? '<circle class="dot" cx="'+x(lastIdx).toFixed(1)+'" cy="'+y(points[lastIdx].v).toFixed(1)+'" r="3.4"/>' : '';
  const labels = '<text class="axis" x="'+PL+'" y="'+(H-4)+'">'+shortD(points[0].d)+'</text>'
    + '<text class="axis" x="'+(W-PR)+'" y="'+(H-4)+'" text-anchor="end">'+shortD(points[points.length-1].d)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(opt.label||'trend chart')+'">'
    + g + (opt.area?'<path class="ar" d="'+area+'"/>':'') + '<path class="ln" d="'+path+'"/>' + ml + dot + labels + '</svg>';
}
function barChart(points, opt){
  opt=opt||{};
  const W=320, H=opt.h||110, PL=26, PR=6, PT=8, PB=18;
  const vals = points.filter(p=>p.v!=null).map(p=>p.v);
  if(!vals.length) return emptyChart(opt.empty||'No data yet');
  const max = Math.max(opt.min1?1:0, ...vals) * 1.15 || 1;
  const bw = (W-PL-PR)/points.length;
  const y = v => PT + (H-PT-PB)*(1-v/max);
  let bars='';
  points.forEach((p,i)=>{
    if(p.v==null || p.v===0){ return; }
    const h = (H-PB) - y(p.v);
    bars += '<rect class="bar" x="'+(PL+i*bw+bw*0.15).toFixed(1)+'" y="'+y(p.v).toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" rx="1.5"/>';
  });
  let g='';
  [max, max/2].forEach(t=>{ g += '<line class="grid" x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/>'
    + '<text class="axis" x="'+(PL-4)+'" y="'+(y(t)+3).toFixed(1)+'" text-anchor="end">'+Math.round(t)+'</text>'; });
  const labels = '<text class="axis" x="'+PL+'" y="'+(H-4)+'">'+shortD(points[0].d)+'</text>'
    + '<text class="axis" x="'+(W-PR)+'" y="'+(H-4)+'" text-anchor="end">'+shortD(points[points.length-1].d)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(opt.label||'bar chart')+'">'+g+bars+labels+'</svg>';
}
function emptyChart(msg){
  return '<div class="empty tiny" style="padding:26px 10px">'+esc(msg)+'</div>';
}
function shortD(s){ const d=parseISO(s); return (d.getMonth()+1)+'/'+d.getDate(); }

/* ---------- insights engine ---------- */
function insights(){
  const out = [];
  const d30 = rangeDates(30), d14 = rangeDates(14), d7 = rangeDates(7);
  const dates = entryDates();
  const nLogged = dates.length;

  /* --- red flag: postmenopausal bleeding --- */
  const bleeds = dates.filter(d=>{ const e=confirmedEntry(d), b=e&&e.bleed; return b && b!=='none'; });
  /* Check EVERY logged bleed against the gap before it, not just the most
     recent one — an event that followed 12+ months of amenorrhoea still needs
     evaluation even if there has been bleeding since. */
  if(bleeds.length){
    let flagged = null;
    for(let i=0;i<bleeds.length;i++){
      const prevRef = i>0 ? bleeds[i-1] : (DB.profile.lastPeriod || null);
      if(!prevRef) continue;
      const gap = daysBetween(prevRef, bleeds[i]);
      if(gap>=365) flagged = {d:bleeds[i], gap};
    }
    if(!hasUterus() && bleeds.length){
      const last = bleeds[bleeds.length-1];
      out.push({t:'alert', h:'You logged bleeding, and you have had a hysterectomy',
        b:'Bleeding on '+fmtDay(last)+'. After the uterus has been removed, vaginal bleeding is unexpected — it is usually something minor such as fragile vaginal tissue, which is common after menopause and very treatable, but it should be looked at rather than watched. Please mention it to a clinician.',
        cta:{l:'Red flags', go:'redflags'}});
      flagged = null;
    }
    /* There is no "resolved" state in the app. Keep this visible until the
       underlying bleeding entry is removed so an unevaluated event cannot
       disappear merely because time passed. */
    if(flagged){
      const since = daysBetween(flagged.d, todayISO());
      out.push({t:'alert', h:'Bleeding after 12+ months without a period',
        b:'You logged bleeding on '+fmtDay(flagged.d)+' — about '+Math.floor(flagged.gap/30)+' months after the previous one. Any bleeding 12 months or more after your last period needs prompt evaluation: around <b>90% of women with endometrial cancer present with postmenopausal bleeding</b>.'
          + (since>30 ? ' That was '+Math.floor(since/30)+' months ago — if it has not been looked at, please book an appointment.' : ' Please book an appointment.')
          + ' ACOG narrowed its guidance in April 2026: most patients should now have both an ultrasound <i>and</i> endometrial tissue sampling, because thickness alone misses higher-grade cancers.',
        cta:{l:'Read why', go:'redflags'}});
    }
  }
  /* --- amenorrhea counter --- */
  /* Counting months of amenorrhoea only means something if a period was
     possible in the first place. */
  if(surgicalMenopause()){
    const surgeryDate=pastOrTodayISO(DB.profile.surgeryDate) ? DB.profile.surgeryDate : null;
    const surgeryWhen=surgeryDate
      ? ' on '+fmtDay(surgeryDate)+' ('+Math.max(0,Math.floor(daysBetween(surgeryDate,todayISO())/30))+' months ago)'
      : '';
    out.push({t:'info', h:'You are postmenopausal — the count of months since a period does not apply',
      b:'Both ovaries removed means menopause happened at the operation'+surgeryWhen+', so this app will not try to date it from bleeding. What is worth attention instead: hormone therapy at least until around age 52 unless there is a reason not to, bone protection, and cardiovascular risk factors. Vaginal and urinary symptoms are the ones that get worse rather than better if left alone.',
      cta:{l:'Your stage', go:'learn:stage'}});
  } else if(!periodsPossible()){
    out.push({t:'info', h:'Your bleeding pattern cannot stage you — that is expected',
      b:(DB.profile.uterus==='hyst'
          ? 'After a hysterectomy there is no bleeding pattern to read, but if your ovaries were left they carry on working — so this may well not be menopause yet.'
          : 'After an endometrial ablation, periods stop or become very light, so the bleeding criterion is unavailable. Your ovaries are unaffected.')
        + ' Symptom trends are your best evidence, which is what the tracking here is for.',
      cta:{l:'What this means', go:'learn:stage'}});
  }
  const lastBleed = (bleeds.length ? bleeds[bleeds.length-1] : (DB.profile.lastPeriod||null));
  if(lastBleed && periodsPossible()){
    const g = daysBetween(lastBleed, todayISO());
    if(g>=60 && g<365){
      out.push({t:'info', h:Math.floor(g/30)+' months since your last logged period',
        b:'Gaps of 60 days or more put you in the late menopausal transition, which typically runs 1–3 years. This is also when hot flashes are most likely to start or intensify. At 12 months without a period, menopause is confirmed retrospectively — and from that point any bleeding needs checking.'});
    } else if(g>=365){
      out.push({t:'ok', h:'Menopause confirmed: '+Math.floor(g/365)+'+ '+(g>=730?'years':'year')+' since your last period',
        b:'From here, hot flashes tend to ease for most women. Vaginal and urinary symptoms are the ones that get worse if left alone — they are also very treatable.'});
    }
  }

  /* --- mood streak --- */
  const moodVals = series(d14,e=>e.sym?e.sym.mood:null).map(p=>p.v).filter(v=>v!=null);
  if(moodVals.length>=7){
    const high = moodVals.filter(v=>v>=3).length;
    if(high >= Math.ceil(moodVals.length*0.6)){
      out.push({t:'alert', h:'Low mood on most of the last two weeks',
        b:'You have logged moderate or worse low mood on '+high+' of '+moodVals.length+' recorded days. Perimenopause carries about 40% higher odds of depression than premenopause. This is worth raising with a clinician rather than waiting out — the PHQ-9 in Tools will give you a number to bring.',
        cta:{l:'Take the PHQ-9', go:'tool:phq9'}});
    }
  }

  /* --- VMS trend --- */
  const hf30 = series(d30, e=>e.hf);
  const hfLogged = hf30.filter(p=>p.v!=null);
  if(hfLogged.length>=8){
    const half = Math.floor(hfLogged.length/2);
    const a = avg(hfLogged.slice(0,half).map(p=>p.v)), b = avg(hfLogged.slice(half).map(p=>p.v));
    const delta = b-a;
    if(Math.abs(delta) >= Math.max(1, a*0.2)){

        b:'This is the highest-leverage gap in the whole app. Resistance training is the intervention that most reliably adds lean mass in postmenopausal women (+0.90 kg across 101 trials; combined training +0.68 kg), and lean mass is what holds up your metabolism, your bone and your independence. Two sessions a week is the target; even one is not nothing.',
        cta:{l:'Starter programme', go:'learn:exercise'}});
    } else {
      const perWk = res28/4;
      out.push({t: perWk>=2?'ok':'info', h:'Strength training: '+r1(perWk)+' sessions a week',
        b: perWk>=2 ? 'You are at or above the guideline of two sessions a week covering all major muscle groups. Three beat two for grip strength in trials of older adults with sarcopenia — worth a look if you want more.'

    }
  }
  /* --- aerobic minutes --- */
  const aero7 = sum(d7.map(d=>{const e=confirmedEntry(d); return e&&e.act?e.act.aero:null;}));

    out.push({t: aero7>=150?'ok':'info', h:aero7+' minutes of aerobic activity this week',
      b: aero7>=150 ? 'At or above the 150-minute guideline. Aerobic work is what moved waist circumference most in the trials (−2.30 cm), while resistance work moved lean mass.'
                    : 'The guideline is 150–300 minutes a week of moderate activity. You are at '+aero7+'. Walking counts.'});
  }

  /* --- weight trend --- */

    const span = daysBetween(wt[0].d, wt[wt.length-1].d) || 1;

    const dir = perWk>0.05?'up':(perWk<-0.05?'down':'steady');
    const disp = v => r1(U.wOut(Math.abs(v)))+' '+U.wLabel();
    if(dir==='steady'){
      out.push({t:'info', h:'Weight is steady — check your waist too',
        b:'The scale can stay flat while body composition shifts. MRI studies found significant visceral fat gain <b>despite no change in weight or waist</b>. Waist circumference is the better single number here, and it responds to diet and exercise with or without weight loss.'});
    } else {
      const fast = Math.abs(perWk) > 1;
      out.push({t: dir==='down'&&!fast?'ok':'info', h:'Weight trending '+dir+' about '+disp(perWk)+' a week',
        b: dir==='down'
          ? (fast ? 'That is faster than the 0.5–1 kg (1–2 lb) a week that predicts better maintenance. In midlife the specific risk of fast loss is lean tissue: even protein distribution at 1.2 g/kg or more went with a lower lean share of the loss — about 26% rather than 34%. Keep the protein and the strength sessions.'

          : 'Midlife weight gain averages about 1.5 lb a year and tracks ageing more than menopause. What tracks menopause is where the fat goes — which is why waist matters.'});

    }

      cta:{l:'Protein calculator', go:'tool:protein'}});
  }
  /* --- alcohol --- */

    out.push({t:'warn', h:'Vaginal or bladder symptoms are showing up regularly',

      cta:{l:'Read the options', go:'learn:sex'}});

  if(dryDays.length>=3 && pf28<8){
    out.push({t:'info', h:'Pelvic floor training is the best-evidenced thing you can do yourself',
      b:'Cochrane review of 31 trials: stress incontinence cured in 56% versus 6% of controls; cured or improved in 74% versus 11%. The catch is technique — many women contract incorrectly on the first attempt, which is why being taught beats guessing.',
      cta:{l:'How to do it', go:'learn:exercise'}});
  }

    e && e.sym && e.sym.sleepq!=null && e.ns!=null

    out.push({t:'warn', h:'Bad sleep, but not much night sweating',
      b:'You are logging poor sleep frequently without heavy night sweats. That pattern points away from vasomotor fragmentation and toward insomnia — or sleep apnea, which affects <b>20% of midlife women</b> versus 4% of younger women and is badly underdiagnosed, because women present with insomnia and fatigue rather than loud snoring. CBT-I is first line for insomnia; if it does not work, that is itself a reason to be tested.',
      cta:{l:'Sleep module', go:'learn:sleep'}});
  }
  /* --- burden trend --- */
  const bd = series(d30, burden).filter(p=>p.v!=null);

    const half=Math.floor(bd.length/2);

        b:'Your tracked burden score moved from '+r1(a)+' to '+r1(b)+' out of 44 across this month. It uses the same 0–4 per-symptom structure as the Menopause Rating Scale, but it is a direction-over-time measure for you and your clinician — there is no validated cut-off for this item set, so we do not label it mild or severe.'});
    }
  }

    const due=Object.keys(SCREENING_RULES).map(id=>screeningStatus(id,age)).filter(s=>s.due);
    if(due.length){
      const labels=due.map(s=>s.rule.label);
      const overdue=due.filter(s=>!s.never);

        b:(overdue.length
            ? 'Your recorded date has reached the reminder interval for '+overdue.map(s=>s.rule.label).join(' and ')+'. '
            : 'You have not recorded these yet. ')

        cta:{l:'Preventive care', go:'screening'}});
    }
  }
  /* --- consistency --- */
  if(nLogged>0 && nLogged<5){
    out.push({t:'info', h:'Keep logging — patterns need about two weeks',
      b:'You have '+nLogged+' '+(nLogged===1?'day':'days')+' recorded. Most of the useful comparisons in here need 10–14 days before they mean anything. A 20-second check-in is enough; you do not need to fill in every field.'});
  }
  if(!out.length){
    out.push({t:'info', h:'Nothing to flag yet',
      b:'Once you have a couple of weeks of check-ins, this page will show your trends, personal patterns, and anything worth raising with a clinician.'});
  }

}

  const push=f=>{ if(!out.some(x=>x.id===f.id)) out.push(f); };
  const ins=insights().filter(i=>!GENERIC_INSIGHTS.test(i.h));
  ins.filter(i=>i.t==='alert').forEach(i=>push({id:'alert-'+slugify(i.h),p:100,kind:'alert',head:i.h,body:i.b,cta:i.cta}));

  /* today's flashes, by time of day */
  const todayHF=dayMoments(t).filter(m=>m.k==='hf');
  if(todayHF.length>=2){
    const w=windowOf(todayHF[0].t);
    if(todayHF.every(m=>windowOf(m.t)===w)){
      const quiet=DAY_WINDOWS.filter(x=>x!==w&&x.id!=='night'&&hmMinutes(nowHM())>=x.e).map(x=>x.id);
      push({id:'today-hf-'+w.id,p:90,kind:'pattern',
        head:numberWord(todayHF.length)+' flashes, all '+w.l+'.'+(quiet.length?' Your '+quiet[0]+'s are clear.':''),
        num:w.range,sub:'today, at '+todayHF.map(m=>m.t).join(', '),
        body:'One day is a note; a week of the same shape is a finding. The dossier keeps count.'});
    }
  }
  /* the week's flashes cluster */
  const weekHF=week.flatMap(d=>dayMoments(d).filter(m=>m.k==='hf').map(m=>({d,t:m.t})));
  if(weekHF.length>=4){
    const byWin={}; weekHF.forEach(m=>{ const w=windowOf(m.t); byWin[w.id]=byWin[w.id]||{w,n:0,days:new Set()}; byWin[w.id].n++; byWin[w.id].days.add(m.d); });
    const top=Object.values(byWin).sort((a,b)=>b.n-a.n)[0];
    const share=top.n/weekHF.length;
    if(share>=0.6&&top.days.size>=3){
      const others=DAY_WINDOWS.filter(x=>x!==top.w&&!(byWin[x.id]&&byWin[x.id].n)&&x.id!=='night');
      push({id:'hf-cluster-'+top.w.id,p:85,kind:'pattern',
        head:'Flashes cluster '+top.w.l+'.',num:top.w.range,
        sub:'on '+top.days.size+' of the last 7 days; '+Math.round(share*100)+'% of '+weekHF.length+' flashes'+(others.length?'; '+others[0].id+'s clear':''),
        body:'Timing is the first thing a clinician will ask about. Afternoon and evening clusters often follow caffeine, heat or a skipped lunch; overnight clusters are the sleep problem in disguise.'});
    }
  }
  /* night waking window */
  const nights=week.map(nightRecord);
  const wakeNights=nights.filter(n=>n.woke.length);
  if(wakeNights.length>=3){
    const buckets={};
    wakeNights.forEach(n=>n.woke.forEach(m=>{ const x=hmMinutes(m.t), start=Math.floor(x/60)*60; [start-60,start].forEach(b=>{ const key=((b%1440)+1440)%1440; buckets[key]=buckets[key]||new Set(); buckets[key].add(n.d); }); }));
    const best=Object.entries(buckets).map(([k,set])=>({start:+k,n:set.size})).sort((a,b)=>b.n-a.n||a.start-b.start)[0];
    if(best&&best.n>=3){
      push({id:'wake-window',p:80,kind:'pattern',head:'You wake between '+hourLabel(best.start).replace(':00','')+' and '+hourLabel(best.start+120).replace(':00','')+'.',
        num:best.n+' of 7',sub:'nights with a wake in that window',
        body:'The second half of the night is where falling oestrogen shows: a sweat wakes you, and the hour after is the hard one. If the sweats go, the sleep usually follows; if not, the sleep needs treating on its own.'});
    }
  }
  /* sweat nights cost wakes */
  const observed=nights.filter(n=>n.observed&&n.wakes!=null), sweatNights=observed.filter(n=>n.sweat>0), dryNights=observed.filter(n=>!n.sweat);
  if(sweatNights.length>=3&&dryNights.length>=2){
    const a=avg(sweatNights.map(n=>n.wakes)), b=avg(dryNights.map(n=>n.wakes));
    if(a!=null&&b!=null&&a-b>=1){
      push({id:'sweat-wakes',p:75,kind:'pattern',head:'Sweat nights cost you '+r1(a-b)+' more '+plural(Math.round(a-b),'wake')+'.',
        num:r1(a)+' <i>vs</i> '+r1(b),sub:'wakes a night, sweat nights vs dry ('+sweatNights.length+' vs '+dryNights.length+')',
        body:'Points at the sweats, not at insomnia. That changes the first thing worth treating.'});
    }
  }
  /* fog after broken nights */
  const fogDays=fortnight.filter(d=>{ const e=confirmedEntry(d); return e&&((e.sym&&e.sym.fog>=1)||dayMoments(d).some(m=>m.k==='fog')); });
  const fortnightNights=fortnight.map(nightRecord).filter(n=>n.observed);
  const brokenNights=fortnightNights.filter(n=>(n.wakes||0)>=2||(n.sweat||0)>=2).map(n=>n.d);
  const calmNights=fortnightNights.filter(n=>!brokenNights.includes(n.d)).map(n=>n.d);
  if(brokenNights.length>=4&&calmNights.length>=3){
    const after=brokenNights.filter(d=>fogDays.includes(d)).length, calm=calmNights.filter(d=>fogDays.includes(d)).length;
    const ra=after/brokenNights.length, rc=calm/calmNights.length;
    if(ra>=0.6&&ra-rc>=0.3){
      push({id:'fog-after-nights',p:70,kind:'pattern',head:'Fog follows broken nights.',
        num:after+' of '+brokenNights.length,sub:'broken nights were followed by fog, vs '+calm+' of '+calmNights.length+' calm ones',
        body:'Concentration trouble that tracks sleep is a sleep problem first. Worth saying in exactly those words at the appointment.'});
    }
  }
  /* treatment watch: the most recent change inside 14 days */
  (Array.isArray(DB.medications)?DB.medications:[]).forEach(med=>{
    (Array.isArray(med.changes)?med.changes:[]).forEach(change=>{
      if(!pastOrTodayISO(change.date)) return;
      const since=daysBetween(change.date,t);
      if(since<2||since>21) return;
      const target=(change.targets||[]).includes('hf')?'hf':(change.targets||[])[0];
      if(!target) return;
      const before=change.baseline&&change.baseline.values&&change.baseline.values[target];
      const afterVals=[]; for(let i=1;i<=since;i++){ const e=confirmedEntry(addDays(change.date,i)); const v=e?(target==='hf'||target==='ns'?e[target]:(e.sym||{})[target]):null; if(v!=null) afterVals.push(v); }
      if(!before||before.n<3||afterVals.length<2) return;
      const after=avg(afterVals), unit=target==='hf'?' flashes a day':' / 4';
      const name=target==='hf'?'flashes a day':(MOMENT_KINDS[target]?MOMENT_KINDS[target].n.toLowerCase():target)+' / 4';
      push({id:'treatment-'+slugify(med.name)+'-'+change.date,p:65,kind:'treatment',
        head:'Since '+esc(med.name)+' changed on '+fmtDay(change.date)+'.',
        num:r1(before.average)+' → '+r1(after),sub:name+', '+since+' days in',
        body:since<14?'Too early to call. The two-week check-in is on '+fmtDay(addDays(change.date,14))+'. Her pattern, not proof.':'Compared with the week before the change. An association in one person; worth discussing, not proof of cause.'});
    });
  });
  /* engine insights that carry a pattern */
  ins.filter(i=>i.t!=='alert').forEach(i=>{
    const screening=/^Worth checking/.test(i.h);
    const p=screening?30:i.t==='warn'?55:i.t==='ok'?50:48;
    push({id:'insight-'+slugify(i.h),p,kind:'insight',head:i.h.replace(/ — /g,': '),body:i.b,cta:i.cta});
  });
  /* the record itself: the headline until there are pages to read */
  const n=entryDates().length, thin=n<3||!out.some(f=>f.kind!=='alert'&&f.kind!=='insight'&&f.p>=60);
  if(n&&thin) push({id:'record-days',p:n<3?95:40,kind:'record',head:n<7?'Day '+n+' of the record. Findings need about a week of pages.':n+' days on record. The dossier is building.',num:String(n),sub:plural(n,'day')+' recorded',body:'Most comparisons need 10 to 14 days before they mean anything. Log what happens; the page does the rest.'});
  if(!n) push({id:'record-empty',p:95,kind:'record',head:'Nothing on record yet. Log the first thing that happens.',body:'One tap files it with the time. The finding of the day appears once there is a day to read.'});
  out.sort((a,b)=>b.p-a.p);
  const seen=DB.findings||(DB.findings={});
  let changed=false;
  out.forEach(f=>{ if(!seen[f.id]&&f.kind!=='record'){ seen[f.id]=t; changed=true; } f.filed=seen[f.id]||t; });
  if(changed){ Object.keys(seen).sort((a,b)=>seen[a].localeCompare(seen[b])).slice(0,Math.max(0,Object.keys(seen).length-200)).forEach(k=>delete seen[k]); save(); }
  return out;
}
function dossierFindings(){ return findings().filter(f=>f.kind==='pattern'||f.kind==='treatment'||f.kind==='insight'||f.kind==='alert'); }


/* ==== appointment-questions.js ==== */
/* Conversation prompts, not diagnoses or treatment instructions.
   Discussion framework: NICE NG197; menopause options: NICE NG23 and NHS.
   This function uses only the supplied local record and never requests a service. */
function buildAppointmentQuestions(brief, context) {
  const concerns = brief.concerns || [];
  if(!concerns.length) return [];
  const keys = new Set(concerns.map(item => item.key));
  const names = context.names || {};
  const name = key => names[key] || key;
  const candidates = [];
  const add = (id, priority, text, reason) => {
    if (!candidates.some(item => item.id === id)) candidates.push({id, priority, text, reason, selected:true});
  };
  const observations = context.observations || [];
  const meaningful = key => keys.has(key) || observations.some(row => row.key === key && row.ready && row.after >= 2);
  const selectedNames = concerns.map(item => name(item.key)).join(', ');
  const templates = {
    hf:['temperature','Which hormonal and non-hormonal options could reduce my hot flashes, and how would we compare their benefits, risks, and fit with my medical history?'],
    ns:['temperature','Could we compare hormonal and non-hormonal options for night sweats, including their effects on sleep and the risks relevant to me?'],
    sleepq:['sleep','How can we tell whether my sleep problem is related to night sweats, insomnia, medication, or another sleep issue? Would a sleep-focused treatment such as CBT for insomnia be worth discussing?'],
    fog:['concentration','What would you check before attributing my concentration or memory difficulties to menopause? How might sleep, mood, or medicines affect the assessment?'],
    energy:['fatigue','What would help distinguish menopause-related fatigue from sleep problems, medication effects, or another cause? Would an examination or targeted tests change the plan?'],
    mood:['emotional','How would you distinguish mood changes around menopause from depression or another concern that needs its own treatment? What support could fit alongside menopause care?'],
    anx:['emotional','Could we assess my anxiety separately as well as in the context of menopause? What would help us choose between talking therapy, menopause treatment, or other support?'],
    irritable:['emotional','Could sleep disruption, stress, or treatment effects be contributing to my irritability? How could we work out which support to try first?'],
    overwhelmed:['emotional','How can we separate the effects of symptoms, poor sleep, and emotional strain when I feel overwhelmed? What practical support or referral could help?'],
    dry:['genitourinary','Could local vaginal treatment or non-hormonal options help my dryness or discomfort, even if I already use menopause treatment? Is there anything else you would want to examine or rule out?'],
    uri:['genitourinary','How would you distinguish menopause-related urinary symptoms from an infection or pelvic-floor problem? Which symptoms would change the assessment or treatment options?'],
    libido:['intimacy','Could discomfort, sleep, mood, medicines, or relationship factors be contributing to low libido? Which should we address first, and when would specialist input help?'],
    joint:['movement','How would you assess whether my joint or muscle pain needs a separate evaluation? What pattern, examination findings, or limits on movement would change the plan?'],
    head:['headache','What should I record about my headaches to help identify their type, and could that affect which menopause treatment options are suitable for me?'],
    palp:['heart-symptoms','What details about my palpitations would help you decide whether I need further assessment? Which accompanying symptoms should prompt urgent medical help?'],
    itch:['skin','How would you distinguish menopause-related dryness from a skin condition or a reaction to a product or medicine? What would make an examination useful?'],
    bloating:['bloating','What pattern or persistence of bloating would make you investigate it rather than assume it is hormonal? Which accompanying changes should I report promptly?'],
    dizzy:['dizziness','What would you want to know about when my dizziness happens, including medicines and other symptoms, to decide what assessment is needed? When should I seek urgent help?']
  };
  concerns.forEach((item,index) => {
    const template=templates[item.key];
    if(template) {
      const related=concerns.filter(c=>templates[c.key]?.[0]===template[0]);
      const impacts=related.filter(c=>c.impact?.trim()).map(c=>name(c.key)+': “'+c.impact.trim()+'”').join('; ');
      add('concern-'+template[0],110-index,(impacts?'In my daily life, '+impacts+'. ':'')+template[1],
        'Your appointment concerns include '+related.map(c=>name(c.key)).join(' and ')+(impacts?'; the question includes your own description of the impact.':'.'));
    }
  });
  if ((meaningful('sleepq') || meaningful('ns')) && (keys.has('fog') || keys.has('energy'))) {
    const sleep=meaningful('sleepq')?'trouble sleeping':'night sweats';
    const daytime=keys.has('fog')?'brain fog':'fatigue';
    add('sleep-daytime',135,'Could '+sleep+' be contributing to my '+daytime+'? How would we assess them together and decide what to address first?',
      'Your selected concerns or sufficiently logged recent symptoms include '+sleep+' alongside '+daytime+'. This suggests a connection to ask about, not a proven cause.');
  }
  const change=(context.changes||[]).filter(item=>!item.targets?.length||item.targets.some(key=>keys.has(key)))[0];
  if(change){
    add('treatment-review',140,'I recorded a change to '+change.medication+' on '+change.date+' (“'+change.label+'”). What improvement should we look for, how long is a fair trial, and when should we review whether the plan needs changing?',
      'A recorded treatment adjustment may be useful context for '+selectedNames+'. Timing alone cannot show whether it caused a symptom change.');
    const followUp=(change.followUps||[]).filter(item=>item.completed).sort((a,b)=>b.completed.localeCompare(a.completed))[0];
    if(followUp && (followUp.benefit<=1 || ['moderate','severe'].includes(followUp.sideEffectLevel))){
      add('treatment-tradeoff',150,'At my '+followUp.week+'-week follow-up for '+change.medication+', I recorded benefit '+followUp.benefit+'/4 and '+followUp.sideEffectLevel+' side effects. How should we weigh benefit against side effects, and what alternatives could we discuss?',
        'Your completed follow-up on '+followUp.completed+' raises a specific treatment-review question. It does not establish that the medicine caused the effects.');
    }
  }
  const worsening=observations.filter(row=>keys.has(row.key)&&row.ready&&row.direction==='higher').sort((a,b)=>(b.after-b.before)-(a.after-a.before))[0];
  if(worsening){
    const value=n=>Math.round(n*10)/10;
    const unit=worsening.key==='hf'?' per day':'/4';
    add('observed-increase',130,'My '+name(worsening.key).toLowerCase()+' average increased from '+value(worsening.before)+unit+' to '+value(worsening.after)+unit+'. What could explain this, and what would you check before deciding whether to change the plan?',
      context.windowLabel+'; '+worsening.priorCount+' and '+worsening.recentCount+' confirmed answers. This is a descriptive comparison, not a clinical threshold.');
  }
  const meds=context.medications||[];
  if(meds.length && !change){
    add('medicine-review',100,'Could we review '+meds.slice(0,2).map(item=>item.name).join(' and ')+' alongside any other medicines or supplements I take? Could their effects or timing matter for '+selectedNames.toLowerCase()+'?',
      'These medications are marked active in your Care record. The app has not checked drug interactions or confirmed their purpose.');
  }
  if(context.profile?.ovaries==='both'){
    add('surgical-context',95,'Does having both ovaries removed change which symptom treatments and longer-term bone or cardiovascular follow-up we should discuss?',
      'Your Profile records removal of both ovaries. Your clinician can check the timing and wider medical history.');
  }
  if(context.profile?.uterus==='intact' && keys.has('hf') && !meds.length){
    add('treatment-fit',90,'If we consider HRT, how would having a uterus affect the treatment combination, and how would we choose a route that fits my risks and preferences?',
      'You selected hot flashes and recorded an intact uterus. This is a question about treatment suitability, not a recommendation to start HRT.');
  }
  if(!meds.length && !keys.has('hf') && !keys.has('ns')){
    add('compare-options',80,'For '+selectedNames.toLowerCase()+', which treatment and non-medicine options are reasonable to compare? What are the likely benefits, downsides, and consequences of waiting?',
      'No active medications are recorded. Your clinician can confirm what you actually take and help compare options.');
  }
  add('next-steps',70,brief.goal
    ?'To work toward “'+brief.goal+'”, what is the first step we can agree today, how will we judge whether it helps, and what should I do if it does not?'
    :'For my '+selectedNames.toLowerCase()+', can we agree what to tackle first, what improvement to look for, when to follow up, and who to contact if things worsen?',
    brief.goal?'This turns your stated goal into an agreed action and review plan.':'A clear action, review date, and contact plan can make the appointment easier to follow through.');
  return [...candidates.filter(item=>item.id!=='next-steps').sort((a,b)=>b.priority-a.priority).slice(0,6),candidates.find(item=>item.id==='next-steps')].map(({priority,...item})=>item);
}
if(typeof module!=='undefined' && module.exports) module.exports={buildAppointmentQuestions};


/* ==== app-companion.js ==== */
/* Right-now help and appointment preparation. Deterministic, on-device, no
   network or model. The appointment brief (concerns, impact, goal, generated
   questions) feeds the dossier's Questions and Opening statement sections. */
const SUPPORT_OPTIONS = {
  sleep:{label:'Can’t sleep',title:'Two minutes, then back to bed.',steps:['Keep the room cool and the light low.','Do not solve tomorrow tonight. It will still be there.','Run the wind-down below if you want something to do with the time.'],tool:'pmr',toolLabel:'Wind down · 2 min',guide:'sleep'},
  overwhelmed:{label:'Overwhelmed',title:'One slow breath at a time.',steps:['Sit down. Feet on the floor.','Breathe out longer than you breathe in. Nothing forced.','Follow the pacer if you like. Stop if you feel dizzy.'],tool:'breath',toolLabel:'Breathe · 2 min',guide:'mind'},
  hot:{label:'Hot flash',title:'Ride it out. It passes.',steps:['Cooler air if you can get it. A fan, a window, a step outside.','Lose a layer.','A cold drink. Then log it, so the timing goes on record.'],tool:'ride',toolLabel:'Ride it out · 60 s',guide:'symptoms'},
  fog:{label:'Brain fog',title:'Make the next step smaller.',steps:['Pick one thing. Only one.','Write it down so your head does not have to hold it.','Take the break you were going to skip.'],guide:'mind'}
};
let supportFeedback=null;
let briefDraft=null, briefStep=1, briefQuestionContext='';

function weeklyStoryData(keys){
  const w=weeklyPatternWindows();
  const rows=(keys||focusedKeys()).map(key=>{
    const observations=dates=>dates.map(date=>({date,value:symptomValue(confirmedRecord(date),key)})).filter(x=>x.value!=null&&Number.isFinite(x.value));
    const prior=observations(w.prior), recent=observations(w.recent);
    const ready=prior.length>=WEEKLY_MIN_COVERAGE&&recent.length>=WEEKLY_MIN_COVERAGE;
    const before=prior.length?avg(prior.map(x=>x.value)):null, after=recent.length?avg(recent.map(x=>x.value)):null;
    const delta=ready?after-before:0, score=ready?Math.abs(delta)/Math.max(Math.abs(before),Math.abs(after),1):0;
    return {key,prior,recent,ready,before,after,direction:!ready?'waiting':score>=0.2&&Math.abs(delta)>=0.35?(delta<0?'lower':'higher'):'steady'};
  });
  return {windows:w,rows,events:treatmentEvents().filter(e=>e.date>=w.prior[0]&&e.date<=w.recent[6])};
}
function storySentence(row){
  const name=symptomName(row.key);
  if(!row.ready) return name+': not enough matching answers yet ('+row.prior.length+'/7 previous, '+row.recent.length+'/7 recent).';
  const unit=row.key==='hf'?' per day':' / 4';
  return name+' was '+(row.direction==='steady'?'broadly steady':row.direction)+': '+r1(row.before)+unit+' → '+r1(row.after)+unit+' ('+row.prior.length+' previous and '+row.recent.length+' recent answers).';
}

/* ---------- right now ---------- */
function supportSheet(kind){
  const option=SUPPORT_OPTIONS[kind];
  if(!option){
    const history=Array.isArray(DB.support)?DB.support:[];
    const helpful=Object.entries(SUPPORT_OPTIONS).map(([key,item])=>({key,item,count:history.filter(x=>x.kind===key&&x.helped==='yes').length})).filter(x=>x.count>0);
    return {title:'Right now',body:`<p class="lead">What is it?</p>
      <div class="biglist">${Object.entries(SUPPORT_OPTIONS).map(([key,item])=>`<button class="bigrow sm" data-act="support-open" data-kind="${key}"><span>${esc(item.label)}</span><span class="s">${helpful.find(x=>x.key===key)?'helped '+helpful.find(x=>x.key===key).count+'×':''}</span></button>`).join('')}</div>
      ${history.length?`<button class="textbtn muted" data-act="support-clear">Clear what-helped history</button>`:''}
      <p class="footnote left">New, severe or worrying symptoms need medical advice, not a breathing exercise. <button class="textbtn" data-act="sheet" data-s="redflags">When to get help</button></p>`};
  }
  const response=supportFeedback&&supportFeedback.kind===kind?supportFeedback.helped:null;
  const source=kind==='overwhelmed'?'https://www.nhs.uk/mental-health/self-help/guides-tools-and-activities/breathing-exercises-for-stress/':'https://www.nhs.uk/conditions/menopause-and-perimenopause/things-you-can-do/';
  return {title:option.label,body:`<p class="lead">${esc(option.title)}</p><ol class="steps">${option.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol>
    ${option.tool?`<button class="btn accent" data-act="sheet" data-s="tool:${option.tool}">${esc(option.toolLabel)}</button>`:''}
    <div class="label" style="margin:22px 0 6px">Did it help</div>
    <div class="seg ink" role="group" aria-label="Did this help">${[['yes','Yes'],['no','No'],['unsure','Unsure']].map(([value,label])=>`<button data-act="support-feedback" data-kind="${kind}" data-value="${value}" aria-pressed="${response===value}">${label}</button>`).join('')}</div>
    ${response?'<p class="xtiny" role="status">Saved. Change it any time.</p>':'<p class="xtiny">Optional. Saved on this device only.</p>'}
    <p class="footnote left">${kind==='fog'?'Practical prompts, not treatment.':'Comfort measures adapted from'} <a href="${source}" target="_blank" rel="noopener noreferrer">NHS self-care guidance</a>. If this keeps happening, it belongs in the dossier and in the room with your clinician. <button class="textbtn" data-act="sheet" data-s="learn:${option.guide}">Read the chapter</button></p>`};
}

/* ---------- appointment brief ---------- */
function savedBrief(){ return appointmentData().brief||{concerns:[],goal:'',date:''}; }
function appointmentSuggestionBrief(){
  const saved=savedBrief();
  if(saved.concerns.length) return saved;
  const rows=weeklyStoryData(PINNABLE_SYMPTOMS).rows;
  const concerns=rows.filter(row=>row.recent.length>=WEEKLY_MIN_COVERAGE&&row.after>0)
    .sort((a,b)=>b.recent.filter(x=>x.value>0).length/b.recent.length-a.recent.filter(x=>x.value>0).length/a.recent.length)
    .slice(0,3).map(row=>({key:row.key,impact:''}));

}
function briefContextKey(brief){ return JSON.stringify([brief.concerns,brief.goal]); }
function beginBrief(){ briefDraft=JSON.parse(JSON.stringify(savedBrief())); briefQuestionContext=briefContextKey(briefDraft); briefStep=1; openSheet('appointment-brief'); }
function captureBriefFields(){
  if(!briefDraft) return;
  briefDraft.concerns.forEach(c=>{const input=document.getElementById('brief-impact-'+c.key); if(input) c.impact=input.value.slice(0,500).trim();});

}
function briefOpening(brief){
