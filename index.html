<style>
/* ============================================================
   peri — the instrument
   One stylesheet. Paper and ink, one vermilion action, true black at night.
   Fraunces for display and numerals, Instrument Sans for everything else.
   Black rules structure the page; there are no cards.
   ============================================================ */

@font-face{
  font-family:"Fraunces";
  src:url("assets/fonts/fraunces-latin-opsz-normal.woff2") format("woff2");
  font-style:normal; font-weight:100 900; font-display:swap;
}
@font-face{
  font-family:"Fraunces";
  src:url("assets/fonts/fraunces-latin-opsz-italic.woff2") format("woff2");
  font-style:italic; font-weight:100 900; font-display:swap;
}
@font-face{
  font-family:"Instrument Sans";
  src:url("assets/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2");
  font-style:normal; font-weight:400 700; font-display:swap;
}
@font-face{
  font-family:"Instrument Sans";
  src:url("assets/fonts/instrument-sans-latin-wght-italic.woff2") format("woff2");
  font-style:italic; font-weight:400 700; font-display:swap;
}

/* ---------- tokens ---------- */
:root{
  --paper:#fbfbf9; --ink:#0c0c0d; --grey:#5f6066; --grey-2:#8a8b91;
  --rule:#0c0c0d; --rule-light:#dad9d4; --tint:#efeee9;
  --vermilion:#d13a16; --vermilion-text:#c23412; --vermilion-soft:#fbe9e3;
  --night:#000000; --night-ink:#f3f2ee; --night-grey:#9a9ba1; --night-rule:#2a2a2e;

  --bg:var(--paper); --text:var(--ink); --text-2:var(--grey); --text-3:var(--grey-2);
  --surface:var(--paper); --surface-2:var(--tint);
  --border:var(--rule-light); --border-strong:var(--rule);
  --accent:var(--vermilion); --accent-text:var(--vermilion-text); --accent-soft:var(--vermilion-soft);
  --on-accent:#ffffff; --on-ink:var(--paper);
  --ok:var(--ink); --warn:var(--vermilion-text); --alert:var(--vermilion-text); --info:var(--grey);
  --serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px; --r-sm:4px;
  --maxw:560px; --gutter:22px;
  --tap:44px;
}
html[data-theme="dark"]{
  --bg:var(--night); --text:var(--night-ink); --text-2:var(--night-grey); --text-3:#6f7076;
  --surface:var(--night); --surface-2:#141416;
  --border:var(--night-rule); --border-strong:var(--night-ink);
  --accent:var(--vermilion); --accent-text:#f06a47; --accent-soft:#2a140e;
  --on-ink:var(--night); --ok:var(--night-ink); --warn:#f06a47; --alert:#f06a47; --info:var(--night-grey);
  color-scheme:dark;
}
/* Night surfaces are true black whatever the theme: the log sheet and the night desk. */
.night{
  --bg:var(--night); --text:var(--night-ink); --text-2:var(--night-grey); --text-3:#6f7076;
  --surface:var(--night); --surface-2:#141416; --border:var(--night-rule); --border-strong:var(--night-ink);
  --accent-text:#f06a47; --accent-soft:#2a140e; --on-ink:var(--night);
  background:var(--bg); color:var(--text); color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;background:var(--bg)}
html.native-app,html.native-app body{touch-action:manipulation}
html.native-ios-tabs .masthead-nav{display:none!important}
body{
  margin:0; font-family:var(--sans); background:var(--bg); color:var(--text);
  font-size:15.5px; line-height:1.45; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none; overflow-x:clip; font-optical-sizing:auto;
  min-height:100dvh;
}
h1,h2,h3,h4{margin:0 0 .35em; font-family:var(--serif); font-weight:500; line-height:1.1; letter-spacing:-.02em}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.2rem} h4{font-size:1.02rem}
p{margin:0 0 .75em}
a{color:var(--text); text-decoration-thickness:.06em; text-underline-offset:.14em}
a:hover{color:var(--accent-text)}
b,strong{font-weight:600}
button{font-family:inherit; font-size:inherit; cursor:pointer; touch-action:manipulation; color:inherit}
button:disabled{opacity:.4; cursor:default}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,h3[tabindex="-1"]:focus,.sheet:focus{outline:none}
.sr,.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg{display:inline-block;vertical-align:middle}
.ic{width:18px;height:18px;flex:none}

.serif{font-family:var(--serif); font-weight:500; letter-spacing:-.02em}
.italic{font-style:italic; font-weight:400}
.num{font-variant-numeric:tabular-nums}
.label{
  font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-2); line-height:1.3;
}
.label.accent{color:var(--accent-text)}
.rule{height:1px; background:var(--border); border:0; margin:0}
.rule.strong{background:var(--border-strong)}
.rule.thick{height:2px; background:var(--border-strong)}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.small{font-size:13.5px; line-height:1.45}
.tiny{font-size:13px; line-height:1.45}
.xtiny{font-size:12px; line-height:1.4; color:var(--text-2)}
.center{text-align:center}
.right{text-align:right}
.stack>*+*{margin-top:12px}

/* ---------- layout ---------- */
#app{max-width:var(--maxw); margin:0 auto; padding:0 var(--gutter) calc(28px + env(safe-area-inset-bottom)); min-height:100dvh; display:flex; flex-direction:column}
.view{animation:fade .18s ease; flex:1 1 auto; display:flex; flex-direction:column}
.view>.spacer{flex:1 1 auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (min-width:600px){body{padding:24px 0} #app{min-height:calc(100dvh - 48px)}}

/* masthead: wordmark, meta, thick rule, in-page tabs, light rule */
.masthead{padding-top:calc(12px + env(safe-area-inset-top))}
.masthead-top{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; padding:4px 0 8px}
.wordmark{font-family:var(--serif); font-style:italic; font-weight:500; font-size:26px; letter-spacing:-.03em; line-height:1; color:var(--text); text-decoration:none; background:none; border:0; padding:0}
.masthead-meta{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); text-align:right; line-height:1.3}
.masthead-nav{display:flex; align-items:center; gap:18px; border-bottom:1px solid var(--border)}
.masthead-nav button{
  background:none; border:0; padding:10px 0 9px; margin-bottom:-1px; font-size:13px; font-weight:600; letter-spacing:.02em;
  color:var(--text-2); border-bottom:2px solid transparent; min-height:40px;
}
.masthead-nav button[aria-current="page"]{color:var(--text); border-bottom-color:var(--text)}
.masthead-nav .gap{flex:1 1 auto}
.masthead-nav .iconbtn{min-height:40px}
.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;background:none;border:0;border-radius:var(--r);color:var(--text-2);padding:0}
.iconbtn:active{background:var(--surface-2)}
/* plain top bar for secondary screens: back link left, meta right */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:60px; padding-top:env(safe-area-inset-top)}
.topbar .back{display:inline-flex; align-items:center; gap:6px; background:none; border:0; padding:8px 0; font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--text); text-decoration:none; min-height:var(--tap)}
.topbar .meta{font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--text-2); text-align:right}

/* ---------- the finding ---------- */
.finding{padding:22px 0 18px}
.finding .label{margin-bottom:12px}
.finding h1,.finding .head{font-family:var(--serif); font-size:clamp(26px,7.6vw,31px); font-weight:500; line-height:1.06; letter-spacing:-.02em; margin:0; text-wrap:pretty}
.finding .head.quiet{color:var(--text-2); font-weight:400; font-style:italic}
.finding p{margin:12px 0 0; font-size:14px; line-height:1.45; color:var(--text-2)}
.finding .filed{display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-size:12.5px; font-weight:600; color:var(--accent-text); background:none; border:0; padding:0}

/* ---------- ledger ---------- */
.ledger{padding:14px 0 0}
.ledger .label{margin-bottom:4px}
.ledger-row{display:flex; align-items:baseline; gap:14px; padding:11px 0; border-bottom:1px solid var(--border); width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left; color:var(--text)}
.ledger-row:last-child{border-bottom-color:transparent}
.ledger-row .t{width:46px; flex:none; font-variant-numeric:tabular-nums; font-size:13px; font-weight:600; color:var(--text-2)}
.ledger-row .e{font-family:var(--serif); font-size:19px; font-weight:500; letter-spacing:-.01em; line-height:1.15; min-width:0}
.ledger-row .e.accent{color:var(--accent-text)}
.ledger-row .d{font-size:13px; color:var(--text-2); margin-left:auto; text-align:right; flex:none; max-width:48%}
.ledger-row.empty{color:var(--text-2); font-size:14px; padding:16px 0}
.ledger-row.empty .e{font-style:italic; font-weight:400; color:var(--text-2); font-size:17px}
button.ledger-row:active{background:var(--surface-2)}

/* ---------- link rows and footers ---------- */
.linkrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; width:100%; background:none; border:0; border-top:1px solid var(--border-strong); color:var(--text); text-align:left; font-size:14px; min-height:var(--tap)}
.linkrow+.linkrow{border-top-color:var(--border)}
.linkrow b{font-weight:600}
.linkrow .muted{color:var(--text-2)}
.linkrow .ic{color:var(--text)}
.linkrow:active{background:var(--surface-2)}
.actions{display:flex; gap:8px; padding:14px 0 10px; border-top:1px solid var(--border-strong); position:sticky; bottom:0; background:var(--bg); z-index:5; margin-bottom:calc(-1 * env(safe-area-inset-bottom)); padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.actions>*{flex:1.3 1 0; min-width:0; white-space:nowrap}
.actions>.wide{flex:2 1 0}
.actions>.btn:not(.wide){font-size:14px; padding:0 12px}
.footnote{font-size:12px; color:var(--text-2); text-align:center; margin:12px 0 0; line-height:1.45}
.footnote.left{text-align:left}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%;
  min-height:56px; padding:0 18px; border-radius:var(--r); font-family:var(--sans); font-weight:600; font-size:16px; letter-spacing:.01em;
  border:1.5px solid var(--border-strong); background:transparent; color:var(--text); text-decoration:none; text-align:center;
  transition:transform .08s ease, opacity .12s ease;
}
.btn:active{transform:scale(.985)}
.btn.accent{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.ink{background:var(--text); border-color:var(--text); color:var(--on-ink)}
.btn.outline{background:transparent; border-color:var(--border-strong); color:var(--text)}
.btn.quiet{border-color:var(--border); color:var(--text)}
.btn.sm{min-height:var(--tap); font-size:14px; padding:0 14px}
.btn.xs{min-height:36px; font-size:13px; padding:0 12px; width:auto}
.btn.auto{width:auto}
.btn .ic{width:20px;height:20px}
/* compatibility names used by content modules */
.btn.primary{background:var(--text); border-color:var(--text); color:var(--on-ink)}
.btn.ghost{border-color:var(--border); color:var(--text)}
.btn.danger{color:var(--accent-text); border-color:var(--accent-text)}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}
.btn-row.split>*{flex:1 1 0; width:auto}
.textbtn{display:inline-flex; align-items:center; gap:6px; background:none; border:0; padding:8px 0; min-height:var(--tap); font-size:13px; font-weight:600; color:var(--accent-text); text-align:left}
.textbtn.ink{color:var(--text)}
.textbtn.muted{color:var(--text-2)}
.textbtn:disabled{color:var(--text-3)}

/* ---------- numbered sections (dossier) ---------- */
.sec{padding:20px 0 22px; border-bottom:1px solid var(--border-strong)}
.sec:first-of-type{border-top:1px solid var(--border-strong)}
.sec-head{display:flex; align-items:baseline; gap:12px; margin-bottom:12px}
.sec-head .n{font-family:var(--serif); font-size:14px; font-weight:600; color:var(--accent-text); font-variant-numeric:tabular-nums; flex:none}
.sec-head h2{font-size:24px; margin:0; line-height:1; flex:1 1 auto; min-width:0}
.sec-head .textbtn{padding:0; min-height:0}
.sec-lead{font-family:var(--serif); font-size:22px; font-weight:500; letter-spacing:-.015em; line-height:1.15; margin:0}
.sec p{font-size:14px; line-height:1.45; color:var(--text-2)}
.sec p.ink{color:var(--text)}

/* findings list */
.fnd{display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--border)}
.fnd:first-child{border-top:0}
.fnd .n{font-size:12px; font-weight:600; color:var(--text-2); width:18px; flex:none; padding-top:4px; font-variant-numeric:tabular-nums}
.fnd .body{flex:1 1 auto; min-width:0}
.fnd .head{font-family:var(--serif); font-size:20px; font-weight:500; letter-spacing:-.015em; line-height:1.15; margin:0; text-wrap:pretty}
.fnd .figure{display:flex; align-items:baseline; gap:10px; margin-top:8px; flex-wrap:wrap}
.fnd .big{font-family:var(--serif); font-size:36px; font-weight:500; letter-spacing:-.04em; line-height:.95; font-variant-numeric:tabular-nums; white-space:nowrap}
.fnd .big i{font-style:italic; font-weight:400; font-size:.5em; letter-spacing:0}
.fnd .sub{font-size:13px; color:var(--text-2); line-height:1.3}
.fnd .note{font-size:12.5px; color:var(--text-2); margin:8px 0 0}
.fnd .note b{color:var(--text)}

/* stats strip */
.stats{display:flex; gap:12px; padding:16px 0 18px; border-top:1px solid var(--border-strong); border-bottom:1px solid var(--border-strong)}
.stat{flex:1 1 0; min-width:0}
.stat .v{font-family:var(--serif); font-size:clamp(34px,10vw,44px); font-weight:500; letter-spacing:-.04em; line-height:.95; font-variant-numeric:tabular-nums; white-space:nowrap}
.stat .v small{font-size:.5em; letter-spacing:0}
.stat .v.accent{color:var(--accent-text)}
.stat .k{font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2); margin-top:8px; line-height:1.3}

/* key/value lines (treatments etc.) */
.kv{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--border); font-size:14.5px; line-height:1.5}
.kv:first-child{border-top:0}
.kv b{font-weight:600}
.kv .r{color:var(--text-2); text-align:right; flex:none; max-width:50%}
.kv.stack{flex-direction:column; gap:2px}
.kv.stack .r{text-align:left; max-width:none}

/* numbered question list */
.qn{display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--border)}
.qn:first-child{border-top:0}
.qn .n{font-size:12px; font-weight:600; color:var(--text-2); width:18px; flex:none; padding-top:3px}
.qn .q{font-family:var(--serif); font-size:18px; font-weight:500; letter-spacing:-.01em; line-height:1.25; flex:1 1 auto}
.qn .why{font-size:12.5px; color:var(--text-2); margin-top:6px; line-height:1.4}
.quote{font-family:var(--serif); font-style:italic; font-size:21px; font-weight:400; letter-spacing:-.01em; line-height:1.3; margin:0; text-wrap:pretty}
.quote.empty{color:var(--text-2)}

/* ---------- black lists (log sheet, night desk) ---------- */
.biglist{margin:0; padding:0; list-style:none}
.bigrow{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px; width:100%; padding:15px 0;
  border:0; border-bottom:1px solid var(--border); background:transparent; color:var(--text); text-align:left;
  font-family:var(--serif); font-size:clamp(26px,7.4vw,30px); font-weight:500; letter-spacing:-.02em; line-height:1; min-height:60px;
}
.bigrow:last-child{border-bottom-color:transparent}
.bigrow .s{font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); flex:none; text-align:right}
.bigrow[aria-pressed="true"]{color:var(--accent-text)}
.bigrow[aria-pressed="true"] .s{color:var(--accent-text)}
.bigrow:active{opacity:.7}
.bigrow.sm{font-size:22px; padding:13px 0; min-height:52px}
.seg{display:flex; gap:6px; padding:10px 0 14px}
.seg button{
  flex:1 1 0; min-height:40px; border-radius:var(--r); border:1px solid var(--border); background:transparent; color:var(--text-2);
  font-weight:600; font-size:12px; letter-spacing:.08em; text-transform:uppercase; padding:0 6px;
}
.seg button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.seg.ink button[aria-pressed="true"]{background:var(--text); border-color:var(--text); color:var(--on-ink)}
.clock{font-family:var(--serif); font-size:clamp(72px,24vw,96px); font-weight:400; letter-spacing:-.05em; line-height:.9; font-variant-numeric:tabular-nums}
.clock-sub{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(26px,8.5vw,34px); letter-spacing:-.02em; line-height:1.1; color:var(--text-2)}

/* ---------- close the day ---------- */
.words{display:flex; gap:6px}
.words button{
  flex:1 1 0; min-width:0; height:64px; border:1.5px solid var(--border-strong); border-radius:var(--r); background:transparent; color:var(--text);
  font-family:var(--serif); font-size:clamp(14px,4.3vw,17px); font-weight:500; padding:0;
}
.words button[aria-pressed="true"]{background:var(--text); color:var(--on-ink)}
.check{
  display:flex; align-items:center; gap:12px; padding:13px 0; border:0; border-bottom:1px solid var(--border); background:transparent;
  width:100%; text-align:left; font-size:16px; color:var(--text); min-height:var(--tap);
}
.check .box{width:20px; height:20px; border:1.5px solid var(--text); background:transparent; display:grid; place-items:center; flex:none; border-radius:2px}
.check[aria-pressed="true"] .box{background:var(--text)}
.check .box svg{display:none; width:12px; height:12px}
.check[aria-pressed="true"] .box svg{display:block}
.check .s{margin-left:auto; font-size:12px; color:var(--text-2); font-weight:600; letter-spacing:.06em; text-transform:uppercase}
.check.sm{font-size:14.5px; padding:10px 0}
.summary-line{font-family:var(--serif); font-size:20px; font-weight:500; letter-spacing:-.01em; line-height:1.3}

/* ---------- index ---------- */
.ask{display:flex; align-items:center; gap:12px; padding:18px 0 10px; border-bottom:2px solid var(--border-strong)}
.ask input{
  flex:1 1 auto; min-width:0; border:0; background:transparent; padding:0; font-family:var(--serif); font-size:clamp(20px,6vw,24px); font-weight:500; letter-spacing:-.02em; color:var(--text);
}
.ask input::placeholder{color:var(--text-3); font-style:italic; font-weight:400}
.ask input:focus{outline:none}
.ask .iconbtn{color:var(--text-2); width:36px; height:36px}
.ask-ledger{padding:12px 0 4px; font-size:13px; color:var(--accent-text); font-weight:600}
.entry{display:block; width:100%; text-align:left; padding:16px 0; border:0; border-bottom:1px solid var(--border); background:transparent; color:var(--text)}
.entry .path{font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2)}
.entry .head{font-family:var(--serif); font-size:22px; font-weight:500; letter-spacing:-.015em; line-height:1.15; margin-top:6px}
.entry p{margin:6px 0 0; font-size:14px; line-height:1.45; color:var(--text-2)}
.entry .tag{font-size:12px; color:var(--text-3); margin-top:8px}
.entry:active{background:var(--surface-2)}

/* ---------- first run: a letter with blanks ---------- */
.letter{font-family:var(--serif); font-size:clamp(19px,5.6vw,22px); font-weight:400; line-height:1.5; letter-spacing:-.01em; padding:14px 0 4px; text-wrap:pretty}
.letter+.letter{padding-top:10px}
.blank{
  display:inline-block; vertical-align:baseline; margin:0 4px 6px 0; padding:2px 8px 3px; border:1.5px solid var(--text); border-radius:var(--r-sm);
  background:transparent; color:var(--text); font-family:var(--serif); font-size:1em; font-weight:500; line-height:1.1;
}
.blank[aria-pressed="true"]{background:var(--text); color:var(--on-ink)}
.blank.input{padding:0; border-radius:var(--r-sm); min-width:3.2ch}
.blank input{width:4.2ch; border:0; background:transparent; color:inherit; font:inherit; padding:2px 8px 3px; text-align:center; -moz-appearance:textfield}
.blank input::-webkit-inner-spin-button,.blank input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* ---------- forms ---------- */
label.fl,.fl{display:block; font-weight:600; font-size:13px; letter-spacing:.02em; margin:0 0 6px; color:var(--text)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=email],select,textarea{
  width:100%; padding:12px 12px; border:1px solid var(--border-strong); border-radius:var(--r-sm);
  background:var(--surface); color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.3; min-height:48px;
}
textarea{min-height:88px; resize:vertical; line-height:1.45}
select{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%); background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--text); outline-offset:0; border-color:var(--text)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--ink);margin:0;flex:none}
html[data-theme="dark"] input[type=checkbox],html[data-theme="dark"] input[type=radio]{accent-color:var(--night-ink)}
.field{margin-bottom:16px}
.field .hint{font-size:12.5px; color:var(--text-2); margin:6px 0 0}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.grid2>*,.grid3>*{min-width:0}
.inline-unit{display:flex;gap:8px;align-items:center}
.inline-unit select{width:auto;flex:0 0 auto}
.optrow{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); font-size:15px}
.optrow:last-child{border-bottom:0}
.optrow label{flex:1 1 auto; cursor:pointer}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);min-height:var(--tap)}
.toggle-row:last-child{border-bottom:0}
.toggle-row b{font-weight:600}
.toggle-row span.hint{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px}
.switch{position:relative;width:44px;height:26px;flex:0 0 auto;border-radius:13px;border:1.5px solid var(--text);background:transparent;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--text);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--text)}
.switch[aria-pressed="true"]::after{transform:translateX(18px);background:var(--on-ink)}

/* scale pickers 0-4 (sheets and tools) */
.scale{display:flex; gap:6px}
.scale button{flex:1 1 0; min-width:0; border:1px solid var(--border-strong); background:transparent; color:var(--text); border-radius:var(--r); min-height:46px; font-weight:600; font-size:14px; padding:0}
.scale button[aria-pressed="true"]{background:var(--text); color:var(--on-ink)}
.scale-legend{display:flex;justify-content:space-between;margin-top:5px}
.scale-legend span{font-size:11.5px;color:var(--text-2);letter-spacing:.03em}
.stepper{display:flex; align-items:center; gap:12px; justify-content:space-between}
.stepper .val{font-family:var(--serif); font-size:2.2rem; font-weight:500; font-variant-numeric:tabular-nums; min-width:2.4ch; text-align:center; letter-spacing:-.03em}
.stepper button{width:46px;height:46px;border-radius:var(--r);border:1px solid var(--border-strong);background:transparent;color:var(--text);font-size:1.4rem;font-weight:500;display:grid;place-items:center;line-height:1}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{border:1px solid var(--border-strong); background:transparent; color:var(--text); border-radius:var(--r); padding:0 12px; font-size:13.5px; font-weight:600; min-height:40px; display:inline-flex; align-items:center}
.chip[aria-pressed="true"]{background:var(--text); color:var(--on-ink)}
.chip.sm{min-height:34px; font-size:12.5px; padding:0 10px}

/* ---------- content modules: callouts, badges, accordions, lists, tables ---------- */
.badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--border-strong);border-radius:3px;color:var(--text);white-space:nowrap;vertical-align:middle}
.badge.strong{background:var(--text);color:var(--on-ink)}
.badge.moderate{border-color:var(--text)}
.badge.mixed{border-color:var(--border);color:var(--text-2)}
.badge.none{border-color:var(--accent-text);color:var(--accent-text)}
.badge.accent{border-color:var(--accent-text);color:var(--accent-text)}
.callout{border-left:2px solid var(--text); padding:4px 0 4px 14px; margin:0 0 14px; font-size:14px; line-height:1.5; color:var(--text)}
.callout p:last-child{margin-bottom:0}
.callout .ctitle{display:block;font-weight:600;letter-spacing:.02em;margin-bottom:3px;font-size:13px}
.callout.info{border-color:var(--border-strong)}
.callout.ok{border-color:var(--border-strong)}
.callout.warn{border-color:var(--accent)}
.callout.alert{border-color:var(--accent); background:var(--accent-soft); padding:12px 14px}
.callout.alert .ctitle{color:var(--accent-text)}
details.acc{border-top:1px solid var(--border); margin:0}
details.acc:last-of-type{border-bottom:1px solid var(--border)}
details.acc>summary{padding:14px 0; font-family:var(--serif); font-weight:500; font-size:18px; letter-spacing:-.01em; line-height:1.2; cursor:pointer; list-style:none; display:flex; align-items:center; gap:12px; min-height:var(--tap)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+"; margin-left:auto; color:var(--text-2); font-family:var(--sans); font-size:20px; font-weight:400; line-height:1}
details.acc[open]>summary::after{content:"–"}
details.acc>div{padding:0 0 16px; font-size:14.5px; line-height:1.5}
details.acc>div>*:last-child{margin-bottom:0}
details.plain{margin:14px 0 0; border-top:1px solid var(--border)}
details.plain>summary{padding:12px 0; font-size:13px; font-weight:600; color:var(--text-2); cursor:pointer; list-style:none; min-height:var(--tap); display:flex; align-items:center}
details.plain>summary::-webkit-details-marker{display:none}
details.plain>summary::after{content:"+"; margin-left:auto; font-size:18px}
details.plain[open]>summary::after{content:"–"}
details.plain>div,details.plain>p,details.plain>ul{font-size:13.5px; color:var(--text-2); line-height:1.5}
ul.tick,ul.plain{padding:0 0 0 18px; margin:0 0 12px}
ul.tick li,ul.plain li{margin-bottom:6px; font-size:14.5px; line-height:1.5}
ul.tick{list-style:none; padding:0}
ul.tick li{padding-left:18px; position:relative}
ul.tick li::before{content:""; position:absolute; left:0; top:.72em; width:8px; height:1.5px; background:var(--text)}
ol.steps{padding-left:0; margin:0 0 12px; list-style:none; counter-reset:step}
ol.steps li{position:relative; padding:12px 0 12px 32px; border-top:1px solid var(--border); font-size:15.5px; line-height:1.45; counter-increment:step}
ol.steps li::before{content:counter(step,decimal-leading-zero); position:absolute; left:0; top:13px; font-family:var(--serif); font-size:13px; font-weight:600; color:var(--accent-text)}
.srcs{font-size:12.5px;color:var(--text-2);line-height:1.6}
.srcs a{color:var(--text)}
.stamp{font-size:12px;color:var(--text-2);margin-top:10px;font-style:italic}
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 0 14px}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:320px}
th,td{text-align:left; padding:9px 10px 9px 0; border-bottom:1px solid var(--border); vertical-align:top; line-height:1.4}
th{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-2); font-weight:600; white-space:nowrap; border-bottom-color:var(--border-strong)}
td b{font-weight:600}
.empty{padding:26px 0; color:var(--text-2); font-size:14px}
.empty.center{text-align:center}
.pill-note{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2)}
.rows{margin:0 0 14px; border-top:1px solid var(--border-strong)}
.row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 0; background:none; border:0; border-bottom:1px solid var(--border); color:var(--text); min-height:var(--tap)}
.row .ico{width:22px; flex:0 0 auto; color:var(--text); display:grid; place-items:center}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:600;font-size:15px}
.row .txt span{display:block;font-size:12.5px;color:var(--text-2);line-height:1.4;margin-top:2px}
.row .chev{color:var(--text-2);flex:0 0 auto}
.row:active{background:var(--surface-2)}
.row.active .txt b{color:var(--accent-text)}

/* ---------- charts ---------- */
.chart{width:100%; display:block; overflow:visible}
.chart .grid{stroke:var(--border); stroke-width:1}
.chart .axis{fill:var(--text-2); font-size:9px; font-family:var(--sans)}
.chart .ln{fill:none; stroke:var(--text); stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round}
.chart .ln2{fill:none; stroke:var(--accent); stroke-width:1.4; stroke-dasharray:4 3}
.chart .ar{fill:var(--text); opacity:.06}
.chart .dot{fill:var(--accent)}
.chart .bar{fill:var(--text); opacity:.9}
.chart .bar.dim{opacity:.3}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.chart-legend span{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.chart-legend i{width:12px;height:2px;background:var(--text);display:block}
.chart-legend i.b{background:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--surface-2);display:block;border:1px solid var(--border)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--text) 22%, var(--surface-2))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--text) 45%, var(--surface-2))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--text) 70%, var(--surface-2))}
.heat i[data-l="4"]{background:var(--text)}
.range{display:flex; gap:6px; margin:0 0 14px}
.range button{flex:1 1 0; min-height:40px; border:1px solid var(--border); border-radius:var(--r); background:transparent; color:var(--text-2); font-size:12.5px; font-weight:600; letter-spacing:.04em}
.range button[aria-pressed="true"]{border-color:var(--text); color:var(--text)}
.spark{display:flex; align-items:flex-end; gap:3px; height:28px}
.spark i{flex:1 1 0; background:var(--text); opacity:.85; min-height:2px; display:block}
.spark i.dim{opacity:.2}
.progress{height:3px;background:var(--border);overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--text);transition:width .3s}

/* ---------- sheets ---------- */
.sheet-bg{position:fixed; inset:0; z-index:100; background:rgba(12,12,13,.55); display:flex; align-items:flex-end; justify-content:center; animation:fade .14s ease}
.sheet{
  background:var(--bg); color:var(--text); width:100%; max-width:var(--maxw); max-height:calc(100dvh - 24px); overflow-y:auto; overscroll-behavior:contain;
  border-top:2px solid var(--border-strong); padding:0 var(--gutter) calc(24px + env(safe-area-inset-bottom)); animation:up .2s cubic-bezier(.2,.8,.2,1);
}
.sheet.full{max-height:100dvh; min-height:100dvh; border-top:0}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-bar{position:sticky; top:0; z-index:2; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:60px; padding:calc(8px + env(safe-area-inset-top)) 0 8px; border-bottom:1px solid var(--border); margin-bottom:16px}
.sheet-bar h2{margin:0; font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--text-2); flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sheet-bar .done{background:none; border:0; padding:8px 0 8px 12px; font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--text); min-height:var(--tap)}
.sheet h3{font-size:1.25rem; margin:18px 0 8px}
.sheet h3:first-child{margin-top:0}
.sheet p{font-size:14.5px; line-height:1.5}
.sheet .lead{font-family:var(--serif); font-size:clamp(24px,6.8vw,30px); font-weight:500; letter-spacing:-.02em; line-height:1.08; margin:4px 0 10px; text-wrap:pretty}
.sheet-foot{position:sticky; bottom:0; background:var(--bg); padding:12px 0 0; margin-top:16px; border-top:1px solid var(--border)}
.sheet .sheet-bar.night-bar{border-bottom-color:var(--border-strong); border-bottom-width:2px}

/* toast */
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(22px + env(safe-area-inset-bottom)); z-index:120;
  background:var(--text); color:var(--on-ink); padding:11px 16px; border-radius:var(--r); font-size:13.5px; font-weight:600; max-width:92%; text-align:center;
  animation:up .18s ease;
}

/* ---------- misc ---------- */
.day-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0}
.day-nav .iconbtn{color:var(--text)}
.day-nav .cur{font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2)}
.note{font-size:14px; line-height:1.5}
.note.ink{color:var(--text)}
.pro{display:inline-block; font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; padding:2px 6px; border:1px solid var(--accent-text); color:var(--accent-text); border-radius:3px; vertical-align:middle}
.lock{padding:22px 0; border-top:1px solid var(--border-strong); border-bottom:1px solid var(--border-strong)}
.lock .lead{font-family:var(--serif); font-size:26px; font-weight:500; letter-spacing:-.02em; line-height:1.1; margin:0 0 10px}

/* ---------- print: the dossier and the clinician report ---------- */
@media print{
  @page{margin:14mm}
  html,body{background:#fff !important;color:#000 !important}
  body{font-size:10.5pt;line-height:1.4;overscroll-behavior:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:0}
  #app{max-width:none;padding:0;min-height:0}
  .masthead-nav,.actions,.btn,.textbtn,.seg,.range,.toast,.iconbtn,.sheet-bar .done,.sheet-foot,.no-print{display:none !important}
  .view{animation:none !important}
  body:has(#sheet-host .sheet) #app{display:none !important}
  .sheet-bg{position:static;display:block;background:none;padding:0;animation:none}
  .sheet{width:auto;max-width:none;max-height:none;min-height:0;overflow:visible;border:0;padding:0;animation:none;background:#fff;color:#000}
  .sheet-bar{position:static;background:#fff;border-bottom:2px solid #000;padding:0 0 7px;margin:0 0 12px}
  .sheet-bar h2{color:#000}
  .sec,.fnd,.kv,.qn,.callout,table,tr,svg.chart,.stats{break-inside:avoid;page-break-inside:avoid}
  h1,h2,h3,h4,summary{break-after:avoid;page-break-after:avoid;color:#000}
  p,li{orphans:3;widows:3}
  .muted,.faint,.tiny,.xtiny,.srcs,.stamp,.label,.sec p,.fnd .sub,.fnd .note,.kv .r,.stat .k,.footnote{color:#333 !important}
  .label.accent,.sec-head .n,.stat .v.accent,.fnd .e.accent{color:#000 !important}
  .tw{overflow:visible}
  table{min-width:0;font-size:9pt}
  th,td{padding:5px 7px;border-color:#aaa}
  .chart .axis{fill:#333}
  .chart .grid{stroke:#bbb}
  .srcs a[href^="http"]::after{content:" (" attr(href) ")";font-size:.86em;overflow-wrap:anywhere}

}

/* ---------- forms inside sheets and the dossier ---------- */
.form{padding:16px 0 18px;border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong);margin:8px 0 18px}

html.night-page,html.night-page body{background:#000}
.page-night{min-height:calc(100dvh - 28px);margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter) 22px;box-sizing:border-box}
@media (min-width:600px){.page-night{margin:0;padding:0 0 22px;border-radius:0}}
.view.night .masthead-meta,.view.night .topbar .meta{color:var(--text-2)}

<body>
<noscript><div style="padding:24px;font-family:system-ui">peri needs JavaScript. Everything runs locally in your browser — there is no server involved.</div></noscript>
<script>
/* ==== content-a.js ==== */
/* ============================================================
   Content module A — symptom library, treatment landscape,
   supplements. All statements traceable to the sources listed
   in the Sources section. Reviewed: July 2026.
   ============================================================ */

const EV = {
  strong:   '<span class="badge strong">Strong evidence</span>',
  moderate: '<span class="badge moderate">Moderate</span>',
  mixed:    '<span class="badge mixed">Mixed / weak</span>',
  none:     '<span class="badge none">No good evidence</span>'
};

const DISCLAIMER_SHORT =
  '<p class="xtiny">Education, not medical advice. Nothing here replaces a conversation with a clinician who knows your history.</p>';

/* ---------------- Symptom library ---------------- */
const SYMPTOMS = [
  {
    id:'vms', name:'Hot flashes & night sweats', tag:'Vasomotor symptoms',
    quick:'Up to 80% of women. Among those with frequent flashes, a median 7.4 years — longer if they start early.',
    body:`
    <p><b>What's happening.</b> Falling and fluctuating oestrogen destabilises the temperature-control centre in the hypothalamus, narrowing the range your body tolerates before it triggers a heat-dumping response — flushing, sweating, then often a chill.</p>
    <h4>Numbers worth knowing</h4>
    <div class="tw"><table><tbody>
      <tr><td>Affected during the transition</td><td><b>up to 80%</b></td></tr>
      <tr><td>Length of one episode</td><td><b>1–5 min</b></td></tr>
      <tr><td>Median total duration (SWAN, women with frequent flashes)</td><td><b>7.4 years</b></td></tr>
      <tr><td>Median duration <i>after</i> the final period</td><td><b>4.5 years</b></td></tr>
      <tr><td>If they start before periods change</td><td><b>&gt;11.8 years</b></td></tr>
      <tr><td>If they start after menopause</td><td><b>3.4 years</b></td></tr>
    </tbody></table></div>
    <p class="tiny muted">All the duration figures above come from the SWAN participants who had frequent symptoms, so they describe the harder end of the range. Duration also differs meaningfully by group in that cohort: African American 10.1 years, Hispanic 8.9, non-Hispanic white 6.5, Chinese 5.4, Japanese 4.8. Most consumer content quotes only the white average.</p>
    <div class="callout info"><span class="ctitle">Peak risk sits around your final period</span>
    Not in the years long before it. In SWAN, about 1 in 4 women had persistently high symptoms, 1 in 4 had persistently minimal ones, and the rest peaked either early or near the final period.</div>
    <h4>What has evidence</h4>
    <ul class="tick">
      <li><b>Hormone therapy</b> — most effective option, roughly 75% reduction. ${EV.strong}</li>
      <li><b>Menopause-specific CBT</b> — 65–78% of women reach clinically meaningful improvement in how much flashes bother and interfere. It changes the impact more than the count. ${EV.strong}</li>
      <li><b>Clinical hypnosis</b> — one trial: 74% vs 17% reduction in frequency; 57% vs 10% on physiologically measured flashes. ${EV.strong}</li>
      <li><b>Non-hormonal prescriptions</b> — SSRIs/SNRIs and gabapentin (Level I), oxybutynin (Level I–II), and the newer neurokinin antagonists fezolinetant and elinzanetant. <b>Fezolinetant carries a boxed warning for liver injury and requires scheduled liver blood tests.</b> See Treatment options. ${EV.strong}</li>
      <li><b>Weight loss</b> — in one trial, losing 7.5 kg vs 2 kg raised the odds of flash improvement; per 5 kg lost, OR 1.32. ${EV.moderate}</li>
    </ul>
    <div class="callout warn"><span class="ctitle">The honest bad news</span>
    <p>The Menopause Society reviewed the trials and does <b>not</b> recommend, <i>for hot flashes specifically</i>: paced breathing, cooling techniques, avoiding triggers, exercise, yoga, mindfulness, relaxation, dietary change, acupuncture, or any dietary supplement.</p>
    <p>That is a narrow claim about one symptom. Exercise, sleep work and mindfulness have strong evidence for mood, sleep, bone, heart health and muscle — just not for stopping flashes.</p></div>
    <p class="tiny"><b>Triggers.</b> Alcohol, caffeine and spicy food are commonly blamed. The evidence is cross-sectional at best, and trigger-avoidance has never been tested as a treatment. Treat it as a personal experiment, not a rule — the app has a 28-day removal-and-reintroduction test for exactly this.</p>
    <p class="tiny"><b>Not just discomfort.</b> The American Heart Association notes hot flashes are associated with subclinical atherosclerosis and worse cardiovascular risk factors — a reason to take them seriously rather than endure them.</p>`
  },
  {
    id:'sleep', name:'Sleep problems', tag:'Insomnia, waking, apnea',
    quick:'40–56% in peri/post vs 31% before. The most missed diagnosis here is sleep apnea.',
    body:`
    <p><b>Three different problems get called "menopause insomnia," and they need different fixes.</b></p>
    <div class="tw"><table><tbody>
      <tr><td>Sleep difficulty, premenopause</td><td><b>31%</b></td></tr>
      <tr><td>Peri- / post- / surgical menopause</td><td><b>40–56%</b></td></tr>
      <tr><td>Odds vs premenopause</td><td>peri <b>1.6×</b>, post <b>1.67×</b>, surgical <b>2.17×</b></td></tr>
      <tr><td>Meeting insomnia-disorder criteria</td><td><b>~26%</b></td></tr>
      <tr><td>Moderate/severe sleep apnea in midlife women</td><td><b>20%</b> (vs 4% younger)</td></tr>
    </tbody></table></div>
    <h4>Which one is it?</h4>
    <ul class="tick">
      <li><b>Night sweats wake you soaked</b> → vasomotor-driven fragmentation. Treat the flashes. Cool the room for comfort and sleep — that part is not a flash treatment.</li>
      <li><b>Dry, wide awake, mind racing, can't get back to sleep</b> → insomnia. <b>CBT-I first</b>, not pills.</li>
      <li><b>Snoring, witnessed pauses, morning headache, unrefreshing sleep despite hours in bed, nocturia, blood pressure that won't come down</b> → get screened for <b>obstructive sleep apnea</b>.</li>
    </ul>
    <div class="callout alert"><span class="ctitle">Sleep apnea is badly underdiagnosed in women</span>
    Women present less often with loud snoring and witnessed apneas, and more often with insomnia, fatigue, morning headache and low mood — which get filed under "just menopause." Risk rises with the transition (apnea index up ~4% per year of progression) and independently after surgical menopause (bilateral oophorectomy HR 1.43). If CBT-I doesn't work, that is itself a reason to test.</div>
    <p class="tiny">The sleep module has the full CBT-I protocol — the part that actually works, not a sleep-hygiene checklist. In the best menopause-specific trial, sleep hygiene education alone produced <b>4%</b> remission; CBT-I produced <b>54%</b> at the end of treatment and <b>68%</b> at six months.</p>`
  },
  {
    id:'mood', name:'Mood, anxiety & irritability', tag:'Depression risk window',
    quick:'Perimenopause carries ~40% higher odds of depression. Postmenopause does not.',
    body:`
    <p><b>There is a real window of vulnerability, and it is specifically perimenopause.</b> A 2024 meta-analysis of 9,141 women found ~40% higher odds of depression in perimenopause versus premenopause — with <b>no significant elevation in postmenopause</b>. Separate guideline work puts the risk of a major depressive episode at 2–4× during the transition and early postmenopause.</p>
    <h4>Who is at higher risk</h4>
    <ul class="plain">
      <li>Previous depression — this is the strongest predictor; first-ever depression starting in perimenopause is less common</li>
      <li>Severe sleep disruption and severe hot flashes</li>
      <li>High trait anxiety, current anxiety disorder, past premenstrual mood symptoms, postpartum blues</li>
      <li>Financial strain, stressful life events, adverse childhood experiences</li>
      <li>After hysterectomy — depression risk is elevated by roughly 20–44%, whether or not the ovaries were removed; and primary ovarian insufficiency (54.5% lifetime prevalence)</li>
    </ul>
    <div class="callout info"><span class="ctitle">Important framing from the SWAN study</span>
    Most midlife women do <b>not</b> experience clinically high depressive symptoms. And stressful life events, poor sleep, hot flashes and past adversity often mattered more than hormonal change itself. Menopause is a risk window, not a cause.</div>
    <h4>What has evidence</h4>
    <ul class="tick">
      <li><b>SSRIs/SNRIs</b> — first line for depression in this population; desvenlafaxine 50–200 mg/day has the largest trial base. ${EV.strong}</li>
      <li><b>CBT</b> — effective; typically 16+ sessions; combining with medication may beat medication alone. ${EV.strong}</li>
      <li><b>Exercise for depressive symptoms</b> — pooled SMD −1.04, a large effect, though heterogeneity between trials was very high. Bigger in perimenopause (−1.56) than postmenopause (−0.93); mind-body forms and 60–90 min sessions did best. ${EV.moderate}</li>
      <li><b>Transdermal oestradiol</b> — has antidepressant effects in <i>perimenopausal</i> women with depression, especially alongside hot flashes. It is <b>ineffective</b> for established depression in postmenopausal women, and is not approved for mood. ${EV.moderate}</li>
      <li><b>Mindfulness / MBSR</b> — helps stress and, in the best single trial, anxiety and depression subscales (d = −0.49). Did <b>not</b> touch vasomotor, somatic or urogenital symptoms. ${EV.moderate}</li>
      <li><b>Slow-paced breathing, progressive muscle relaxation</b> — small-to-medium effects on stress, anxiety, low mood. ${EV.moderate}</li>
    </ul>
    <p class="tiny"><b>On rage and irritability:</b> these dominate social media and are widely reported clinically, but the research base is genuinely thin — there is no good prevalence figure for menopausal "rage." What we can identify and treat are the contributors: broken sleep, symptom burden, and pre-existing anxiety. Anyone telling you the numbers on this is making them up.</p>
    <div class="callout alert"><span class="ctitle">Get help promptly</span>
    Thoughts of harming yourself, or low mood that isn't lifting, need proper mental-health care — not a hormone adjustment. Depression meeting diagnostic criteria is treated differently from depressive symptoms around menopause.</div>`
  },
  {
    id:'fog', name:'Brain fog', tag:'Memory & processing speed',
    quick:'Real, measurable — and the perimenopausal dip appears to be temporary.',
    body:`
    <div class="callout ok"><span class="ctitle">The most under-communicated good news in this field</span>
    In the SWAN cohort, women normally improve with practice on memory and processing-speed tests. During perimenopause that practice improvement disappeared — and then <b>"improvement with practice was seen again in early postmenopause."</b> The perimenopausal decrement looks transient.</div>
    <ul class="tick">
      <li><b>Processing speed</b> is the most consistently affected domain.</li>
      <li>Objective <b>verbal memory</b> decline emerged after about <b>age 58</b>; working memory later.</li>
      <li><b>Self-reported</b> hot flashes were not associated with memory decrements; <b>objectively measured</b> ones have been in other work.</li>
      <li><b>Depression, anxiety and poor sleep</b> impaired performance — these are the modifiable levers.</li>
      <li>Cardiovascular risk factors accelerate later processing-speed decline.</li>
    </ul>
    <p><b>So what helps:</b> repair sleep, treat mood, manage blood pressure/lipids/glucose, keep moving. Hormone therapy is <b>not</b> indicated for cognition, and neither is testosterone — the international consensus explicitly lists cognition among the indications testosterone does <i>not</i> support.</p>
    <div class="callout warn"><span class="ctitle">When it isn't brain fog</span>
    Getting lost in familiar places, other people noticing your word-finding, trouble managing money or medications, or steady worsening rather than fluctuation — these warrant a proper evaluation.</div>`
  },
  {
    id:'gsm', name:'Vaginal & bladder changes', tag:'Genitourinary syndrome of menopause',
    quick:'27–84% of postmenopausal women. Unlike hot flashes, this does not resolve on its own.',
    body:`
    <div class="callout warn"><span class="ctitle">The single most important asymmetry to understand</span>
    Hot flashes usually fade. Genitourinary changes are <b>progressive</b> — urogenital atrophy becomes more prevalent the further past menopause you are. Waiting it out is not a strategy here.</div>
    <p><b>What it covers</b> — the 2025 multi-society guideline defines it as the spectrum of symptoms from declining oestrogen <i>and androgen</i> in the genitourinary tract:</p>
    <ul class="plain">
      <li><b>Genital:</b> dryness, burning, irritation, itching, soreness</li>
      <li><b>Urinary:</b> urgency, frequency, painful urination, night-time urination, leaking, <b>recurrent UTIs</b></li>
      <li><b>Sexual:</b> pain with sex, inadequate lubrication, bleeding after sex</li>
    </ul>
    <p>Prevalence estimates range 27–84% (13–87% in the 2025 guideline) — the spread reflects different questionnaires, not uncertainty about whether it's common. One study found it in 84% of women six years past menopause.</p>
    <h4>What works</h4>
    <p>See <b>Intimacy & sexual health</b> for the full options table. Headlines:</p>
    <ul class="tick">
      <li><b>Low-dose vaginal oestrogen</b> — Strong Recommendation. Blood oestradiol stays within the normal postmenopausal range (3–11 pg/mL). No progestogen needed. ${EV.strong}</li>
      <li><b>For recurrent UTIs</b> — vaginal oestrogen reduces recurrence; in one trial from 5.9 to 0.5 episodes/year. This carries the strongest evidence grade in the 2025 guideline. ${EV.strong}</li>
      <li><b>Moisturisers and lubricants</b> — recommended, alone or alongside. ${EV.moderate}</li>
      <li><b>Vaginal DHEA (prasterone)</b> — a recommended option. <b>Ospemifene</b> (oral) is a conditional option that <b>carries a boxed warning for blood clots and stroke</b> — see Intimacy &amp; sexual health for the detail. ${EV.moderate}</li>
      <li><b>Vaginal laser / radiofrequency</b> — the guideline says the evidence does <b>not</b> support these. ${EV.none}</li>
    </ul>`
  },
  {
    id:'joints', name:'Joint & muscle aches', tag:'Musculoskeletal',
    quick:'Very commonly reported. The science is younger than the marketing.',
    body:`
    <p>Aching joints, stiffness, new tendon problems and loss of strength are among the most frequently reported midlife complaints. A 2024 review proposed the term "musculoskeletal syndrome of menopause" to group them.</p>
    <div class="callout warn"><span class="ctitle">Be careful with the numbers you see quoted</span>
    The widely circulated "71% / 80% / 25%" figures come from that single 2024 review, reached through secondary summaries — the primary text is paywalled. The term is <b>not yet adopted</b> by NICE, the Menopause Society or ACOG. Treat joint pain as a common midlife symptom, not a diagnosis with settled epidemiology.</div>
    <p><b>What is on firmer ground:</b> bone loss begins 1–3 years before menopause and continues 5–10 years, averaging <b>10–12% loss</b> at spine and hip. Lean muscle mass declines while fat redistributes. Those are documented and both are trainable.</p>
    <h4>Levers with independent evidence</h4>
    <ul class="tick">
      <li>Progressive strengthening around the painful joint</li>
      <li>Load management — reduce volume during flares, keep frequency</li>
      <li>Reducing excess adiposity</li>
      <li>Sleep repair (pain and poor sleep amplify each other)</li>
      <li>Clinical evaluation to exclude inflammatory arthritis — new symmetrical joint swelling, prolonged morning stiffness, or systemic symptoms are not "just menopause"</li>
    </ul>
    <p class="tiny"><b>Editorial caution:</b> "menopause causes your joint pain, so take hormone therapy" is being over-claimed commercially. Arthralgia is not a Menopause Society indication for hormone therapy. Frozen shoulder is often cited as menopause-related; no guideline establishes that link.</p>`
  },
  {
    id:'weightsym', name:'Weight & body shape change', tag:'Body composition',
    quick:'The scale can stay flat while body composition worsens. That is the real story.',
    body:`
    <div class="callout info"><span class="ctitle">The myth to retire: "menopause tanks your metabolism"</span>
    In 120 women, resting energy expenditure adjusted for body composition declined with <b>age</b> (−3.9 kcal/day/year) but showed <b>no difference by menopausal status</b> (7 kcal/day, p=0.78). Doubly-labelled-water work across the lifespan found energy expenditure most stable from the 20s to about 60, then declining ~0.7%/year. No menopause cliff was found.</div>
    <p><b>What does change:</b> where fat is stored, and how much muscle you keep.</p>
    <ul class="tick">
      <li>Rate of fat gain <b>doubles</b> about 2 years before the final period, with simultaneous lean-mass decline; it flattens ~2 years after.</li>
      <li>Visceral fat rises from roughly <b>5–8%</b> of body fat premenopause to <b>15–20%</b> after — +8.2%/year in the 2 years before the final period. Figures vary between cohorts.</li>
      <li>Trunk fat is about <b>36% higher</b> postmenopause; one 5-year comparison found intra-abdominal fat area up 49%.</li>
      <li>MRI studies found significant visceral fat gains <b>despite no change in weight or waist</b>.</li>
      <li>Total weight rises fairly <b>linearly with age</b> — roughly 1.5 lb/year through the 50s. That part tracks ageing, not menopause.</li>
    </ul>
    <p><b>Why it matters:</b> the American Heart Association notes rising LDL cholesterol and apolipoprotein B plus central fat gain raise cardiovascular risk <b>even in women of normal body weight</b>. Early postmenopausal women had 2.1× the odds of LDL ≥130 mg/dL versus premenopause.</p>
    <p class="tiny">Because resting metabolism tracks lean mass, <b>losing muscle is the mechanism by which crash dieting lowers your metabolism</b>. That is the actual argument against aggressive restriction in midlife — and it's a good one.</p>`
  },
  {
    id:'skinsym', name:'Skin, hair & nails', tag:'Dermatological',
    quick:'Barrier function, collagen and hair density all shift. Four topicals carry real evidence.',
    body:`
    <p><b>What oestrogen decline does to skin.</b> Less fibroblast-driven collagen and glycosaminoglycan synthesis, more matrix-metalloproteinase activity, so the dermis thins. Barrier integrity drops: ceramides in the stratum corneum are fewer and shorter-chained with disrupted organisation, water loss rises — hence dryness, sensitivity and itch. Oestrogen also supports wound healing.</p>
    <div class="callout warn"><span class="ctitle">About the "30% collagen loss in 5 years" figure</span>
    It traces to a 2026 dermatology review, so we will cite it — with the caveat that it is one review's headline number rather than a replicated measurement. The companion claim you'll see everywhere, "2% per year after that," we could not verify from any primary source, so this app does not publish it.</div>
    <ul class="tick">
      <li><b>Female pattern hair loss</b> — common after menopause; one 2026 dermatology review reports it in about half of postmenopausal women, though the underlying prevalence studies were paywalled to us, so treat the exact figure loosely. Mechanism: shortened growth phase, follicle miniaturisation, lower density.</li>
      <li><b>Adult acne</b> — around 15% of women; more truncal and lower-face, milder but on more reactive skin, so more marks and discolouration.</li>
      <li><b>Rosacea</b> often worsens — barrier impairment, more vascular reactivity, microbiome shifts, and flushing that overlaps with hot flashes.</li>
      <li><b>Itch and crawling sensations</b> — partly dryness, partly neuroinflammatory: oestrogen deficiency is associated with increased cutaneous nerve fibre density.</li>
      <li><b>Brittle nails</b> — up to 20% of people, more in women over 50, mostly idiopathic. We found no quality source tying nail change to oestrogen, so we don't claim one.</li>
    </ul>
    <p>See the <b>Skin & hair</b> module for what to actually use — the four ingredients with the best data, and the ones to skip.</p>`
  },
  {
    id:'other', name:'Less-discussed symptoms', tag:'Palpitations, migraine, dry eye, mouth',
    quick:'Some are well documented. Others are widely claimed with almost no evidence.',
    body:`
    <h4>Palpitations ${EV.moderate}</h4>

  <li>An estimated <b>1–2.5 million US women per year</b> use unregulated compounded preparations or pellets.</li>

    {t:"I'm not sure what was removed", v:'unsure'}
  ]},
  {id:'ovaries', q:'Have your ovaries been removed?',
   note:'Many women keep both ovaries during a hysterectomy — this is often called a partial hysterectomy, though that phrase is used loosely and can also mean the cervix was left in place. If you are unsure, your surgical notes or your surgeon can tell you.',
   a:[
    {t:'No — both ovaries are still there', v:'kept'},
    {t:'One was removed', v:'one'},
    {t:'Both were removed', v:'both'},
    {t:"I'm not sure", v:'unsure'}
  ]},
  {id:'surgWhen', q:'Roughly how long ago was that surgery?',
   when:a => a.uterus==='hyst' || a.uterus==='ablation' || a.uterus==='unsure'
          || a.ovaries==='both' || a.ovaries==='one',
   a:[
    {t:'Less than 3 months ago', v:'lt3m'},
    {t:'3–12 months ago', v:'lt1y'},
    {t:'1–5 years ago', v:'1to5'},
    {t:'More than 5 years ago', v:'gt5'},
    {t:"I don't remember", v:'unsure'}
  ]},

    {t:'Yes', v:'yes'}
  ]},
  {id:'cycle', q:'Which best describes your periods over the last year?',
   when:a => a.uterus==='intact' && a.ovaries!=='both' && a.contra==='no',
   a:[

    {t:'Still regular but cycles feel shorter', v:'short'},
    {t:'Cycle length varies by a week or more between periods', v:'var7'},
    {t:'I have skipped periods — gaps of 60 days or more', v:'skip'},
    {t:'No period for 12 months or more', v:'none12'}
  ]},
  {id:'since', q:'Roughly how long ago was your last period?',
   when:a => a.uterus==='intact' && a.ovaries!=='both' && a.contra==='no' && a.cycle==='none12',
   a:[
    {t:'Less than 2 years ago', v:'lt2'},
    {t:'2–6 years ago', v:'2to6'},
    {t:'More than 6 years ago', v:'gt6'}
  ]},
  {id:'vms', q:'Are you having hot flashes or night sweats?', a:[
    {t:'No', v:'no'}, {t:'Occasionally', v:'some'}, {t:'Often, and they bother me', v:'lots'}
  ]}
];
/* Which questions apply, given the answers so far. */
function stageQueue(a){ return STAGE_Q.filter(q => !q.when || q.when(a)); }

/* Shared blocks --------------------------------------------------- */
const NO_PERIOD_STAGING = `
<p><b>Why this tool can't stage you from bleeding.</b> Every staging system uses your bleeding pattern as its primary criterion — STRAW+10 says so explicitly, because hormone assays are not standardised well enough to define the stages. With no usable bleeding pattern, that route is closed. Staging then has to rely on hormone markers, and STRAW+10 says not to attempt it until <b>at least 3 months after surgery</b>.</p>
<p><b>What still works.</b> Your symptoms. Hot flashes, night sweats, disrupted sleep, mood change, vaginal dryness and bladder symptoms can all be assessed and treated on their own merits, with or without a stage attached. This is exactly what the tracking in this app is for — take a few weeks of it to your clinician, because a trend is worth more than any single blood test.</p>
<p><b>One place blood tests earn their keep.</b> NICE tells clinicians not to routinely use FSH in women over 45, because it should be diagnosed from cycle change and symptoms. When there is no cycle to read, that reasoning does not apply in the same way, and a clinician may reasonably use hormone markers. Worth asking about rather than assuming either way.</p>`;

const OOPHOR_TESTOSTERONE = `<p>Two things specific to having both ovaries removed. The British Menopause Society suggests <b>considering added testosterone after removal of both ovaries</b>. And surgical menopause independently raises sleep apnea risk — in the Nurses' Health Study, bilateral oophorectomy carried a hazard ratio of <b>1.43</b>, and it roughly doubles the odds of sleep disturbance versus premenopause (OR 2.17). If you are exhausted and sleeping badly, that is worth naming as a possible cause rather than filing under "menopause".</p>`;

function stageResult(a){
  const out = {stage:'', label:'', body:'', flags:[]};
  const noUterus  = a.uterus==='hyst';
  const ablation  = a.uterus==='ablation';
  const bothGone  = a.ovaries==='both';
  const young     = a.age==='u40';
  const earlyAge  = a.age==='40s_e';
  const fresh     = a.surgWhen==='lt3m';

  /* ---- 1. Both ovaries removed: surgical menopause, regardless of uterus ---- */
  if (bothGone){
    out.label = 'Surgical menopause';
    out.body = `<p>Removing both ovaries causes menopause immediately. The hormone drop is abrupt and steep rather than gradual, which is why symptoms are often more intense than after natural menopause${noUterus?', and why nothing about your periods can tell you where you are':''}.</p>
    ${fresh?`<div class="callout warn"><span class="ctitle">You are less than 3 months post-op</span>
    Symptoms are often at their most intense in these first weeks, and this is also the window in which staging and hormone testing are least reliable — STRAW+10 says not to attempt staging until at least 3 months after surgery. If you are struggling now, that is a reason to contact the team who operated rather than to wait it out.</div>`:''}
    <p><b>This is managed differently from natural menopause, and the difference matters.</b> The Menopause Society recommends hormone therapy for premature or early menopause <b>at least until the average age of natural menopause, around 52</b>, absent contraindications — earlier initiation reduces fracture risk and likely cardiovascular mortality. ESHRE agrees and prefers hormone therapy over the combined pill for this purpose.</p>
    ${OOPHOR_TESTOSTERONE}
    ${noUterus
      ? `<div class="callout ok"><span class="ctitle">One thing that is simpler for you</span>
         With no uterus, there is nothing to protect from oestrogen — so <b>oestrogen-only therapy is used, and a progestogen is not needed</b>. That also means you avoid the progestogen component that carries most of the extra breast cancer signal in the risk tables: for oestrogen-only use at ages 50–59 over five years, estimates run from <b>6 fewer</b> to <b>3 extra</b> cases per 1,000 women, against <b>+8 to +10</b> for combined therapy.</div>`
      : `<div class="callout info"><span class="ctitle">You still have your uterus</span>
         So if you take systemic oestrogen you also need a progestogen to protect the lining. That is not optional — unopposed oestrogen for 10 years at ages 60–69 gives about <b>48 extra endometrial cancers per 1,000 women</b>. A levonorgestrel IUD is one accepted way to provide it.</div>`}
    ${(young||earlyAge)?`<p><b>Because this happened before the usual age,</b> the long-term picture deserves attention now rather than later. A 2026 pooled analysis across six US cohorts found menopause before 40 carried about <b>40% higher lifetime coronary heart disease risk</b>. Bone, heart and — if it applies to you — fertility counselling are all part of proper follow-up.</p>`:''}`;
    out.flags.push('Ask a menopause-experienced clinician about hormone therapy at least until around age 52, and about bone and cardiovascular follow-up.');
    if(noUterus) out.flags.push('Any vaginal bleeding after a hysterectomy is unexpected. It is usually something minor, but it should always be reported rather than watched.');
    return out;
  }

  /* ---- 2. Under 40 with ovaries in place: needs assessment, not a stage ---- */
  if (young){
    out.label = 'Possible premature menopause — this needs assessment';
    out.body = `<p>Menopause before 40 is called premature menopause or primary ovarian insufficiency. ESHRE revised its prevalence estimate upward in 2024 to roughly <b>4 in 100 women</b> — higher than the 1 in 100 still quoted in most consumer content.</p>
    <p>Diagnosis requires at least 4 months of irregular or absent periods <b>plus</b> a raised FSH, repeated after 4–6 weeks. This is one of the few situations where blood tests genuinely matter, and it warrants specialist evaluation and psychological support.</p>
    ${(noUterus||ablation)?`<p><b>In your case there is an extra wrinkle:</b> without a readable bleeding pattern, the "4 months of irregular or absent periods" half of that definition is unavailable, so the assessment will lean on hormone markers and symptoms. Say that plainly when you book — it changes what tests are useful.</p>`:''}
    <p>Hormone therapy is recommended until the usual age of menopause to reduce long-term risks to bone, heart and brain. A 2026 pooled analysis across six US cohorts found menopause before 40 carried about <b>40% higher lifetime coronary heart disease risk</b>; premature menopause was three times more common in Black women (15.5% vs 4.8%).</p>`;
    out.flags.push('See a clinician. This needs a proper diagnosis, not a self-assessment — and it is one of the situations where FSH testing is appropriate.');
    return out;
  }

  /* ---- 3. Uterus removed, ovaries kept: NOT menopause ---- */
  if (noUterus){
    out.label = a.ovaries==='one'
      ? 'Ovaries still working — one remaining'
      : 'Ovaries still working, periods gone';
    out.body = `<div class="callout ok"><span class="ctitle">The most important thing to know: this is not menopause</span>
    A hysterectomy removes the uterus. ${a.ovaries==='one'
      ? 'You kept one ovary, and a single ovary generally carries on producing hormones and releasing eggs.'
      : a.ovaries==='unsure'
        ? "If your ovaries were left in place — and they often are — they carry on producing hormones and releasing eggs."
        : 'Your ovaries were left in place, so they carry on producing hormones and releasing eggs.'}
    What has ended is your bleeding, not your ovarian function. You may have years to go before menopause.</div>
    ${a.ovaries==='unsure'?`<div class="callout warn"><span class="ctitle">Worth finding out exactly what was removed</span>
    This genuinely changes the answer. If both ovaries were removed you are postmenopausal now, and guidelines recommend hormone therapy at least until around age 52. If they were left, you are not. Your surgical notes, your GP record, or the surgeon who operated can tell you — and it is a reasonable thing to ask for.</div>`:''}
    ${NO_PERIOD_STAGING}
    ${fresh?`<p><b>You are less than 3 months post-op.</b> Some women get a temporary dip in ovarian function after a hysterectomy that recovers. Symptoms now do not necessarily mean menopause has started — but they are still worth reporting to the team who operated.</p>`:''}
    <div class="callout info"><span class="ctitle">Two things that are simpler for you, and two that need care</span>
    <p><b>Simpler:</b> if you ever take systemic oestrogen, <b>you will not need a progestogen</b> — there is no lining to protect. That matters, because the progestogen component carries most of the extra breast cancer signal: oestrogen-only use at ages 50–59 over five years runs from <b>6 fewer</b> to <b>3 extra</b> cases per 1,000, against <b>+8 to +10</b> for combined therapy. And you can never be uncertain about whether bleeding is a period.</p>
    <p><b>Needs care:</b> cervical screening. Guidance to stop screening applies to women who <i>have no cervix</i> and no history of high-grade changes. If your cervix was left in place — which happens, and is one of the things "partial hysterectomy" can mean — <b>you still need cervical screening</b>. Check which you had. And after a hysterectomy, depression risk is elevated by roughly <b>20–44%</b>, so low mood here deserves attention rather than dismissal.</p></div>`;
    out.flags.push('Find out whether your cervix was left in place — it determines whether you still need cervical screening.');
    out.flags.push('Any vaginal bleeding after a hysterectomy is unexpected. Usually minor, but always worth reporting.');
    return out;
  }

  /* ---- 4. Ablation: uterus present, bleeding unreliable ---- */
  if (ablation){
    out.label = 'Bleeding pattern no longer readable';
    out.body = `<p>An endometrial ablation thins or destroys the lining of the uterus, so periods usually stop or become very light. Your ovaries are unaffected and carry on as before — <b>an ablation does not cause menopause</b>. What it removes is the signal this tool needs.</p>
    ${NO_PERIOD_STAGING}
    <div class="callout warn"><span class="ctitle">Two things specific to still having your uterus</span>
    <p>If you take systemic oestrogen you <b>still need a progestogen</b> to protect the lining, even after an ablation — ablation is not a substitute for endometrial protection. Unopposed oestrogen for 10 years at ages 60–69 gives about 48 extra endometrial cancers per 1,000 women.</p>
    <p style="margin-bottom:0">And bleeding still matters. Because your normal pattern is now light or absent, <b>new or unexpected bleeding is harder to dismiss, not easier</b> — report it rather than assuming the ablation explains it.</p></div>`;
    out.flags.push('Report any new or unexpected bleeding — your baseline pattern no longer tells you what is normal.');
    return out;
  }

  /* ---- 5. Unsure what was removed ---- */
  if (a.uterus==='unsure'){
    out.label = 'Worth finding out what was removed';
    out.body = `<div class="callout warn"><span class="ctitle">This is the one question you should get answered</span>
    Whether your uterus was removed, and separately whether your ovaries were, changes almost everything downstream: whether you are postmenopausal now, whether you need a progestogen alongside oestrogen, whether you still need cervical screening, and how any bleeding should be interpreted. Your surgical notes, your GP or specialist record, or the surgeon who operated can tell you — and asking is entirely reasonable.</div>
    <p>The three combinations, in plain terms:</p>
    <ul class="tick">
      <li><b>Uterus removed, ovaries kept</b> — not menopause. Hormones carry on; you just have no periods to read.</li>
      <li><b>Both ovaries removed</b> — menopause happened at the operation, whatever else was taken. Guidelines recommend hormone therapy at least until around age 52.</li>
      <li><b>Uterus kept, ovaries kept</b> — ordinary staging applies, using your cycle pattern.</li>
    </ul>
    ${NO_PERIOD_STAGING}`;
    out.flags.push('Ask for your surgical record. Everything else follows from it.');
    return out;
  }

  /* ---- 6. Periods masked by contraception ---- */
  if (a.contra==='yes'){
    out.label = 'Periods masked by contraception';
    out.body = `<p>Hormonal contraception and hormone-releasing IUDs suppress or mask bleeding, so your pattern is not telling you about your ovaries. The formal definition of menopause specifically excludes women on hormonal contraception for exactly this reason.</p>
    ${NO_PERIOD_STAGING}
    <p>Two practical notes. Contraception is still doing its job, so this is not a reason to stop it — talk to your clinician about when and how, because it depends on your age and method. And a levonorgestrel IUD can double as the endometrial protection you would need alongside oestrogen, which some women find convenient.</p>`;
    return out;
  }

  /* ---- 7. Ordinary staging from the cycle pattern ---- */
  const oneOvary = a.ovaries==='one'
    ? `<p class="tiny"><b>One thing specific to you:</b> you have one ovary. A single ovary usually maintains normal function and cycles, so ordinary staging still applies — but if you notice symptoms earlier than you expected, that is worth mentioning rather than dismissing.</p>`
    : '';

  if (a.cycle==='none12'){
    if (a.since==='gt6'){
      out.stage='+2'; out.label='Late postmenopause';
      out.body = `<p>You're more than about 6 years past your final period. Hormone levels are stable now and there's little further endocrine change.</p>
      <p><b>What tends to improve:</b> hot flashes, for most women — though they persist into the 60s for a substantial minority. <b>What tends to get worse if untreated:</b> vaginal and urinary symptoms, which become increasingly prevalent in late postmenopause. That asymmetry is the single most useful thing to know at this stage.</p>
      <p><b>Where your attention is best spent now:</b> bone density, cardiovascular risk factors, muscle mass, and treating genitourinary symptoms properly rather than enduring them.</p>${oneOvary}`;
    } else if (a.since==='2to6'){
      out.stage='+1c'; out.label='Postmenopause, roughly years 3–6';
      out.body = `<p>Hormones have settled — they typically stabilise around two years after the final period. Hot flashes often continue into this stage; among women with frequent symptoms the median total duration is 7.4 years, and 4.5 years after the final period.</p>
      <p>Bone loss continues for 5–10 years around the transition, averaging 10–12% at spine and hip. This is a good window for a serious look at resistance training, protein, and whether bone density screening is warranted.</p>${oneOvary}`;
    } else {
      out.stage='+1a/b'; out.label='Early postmenopause — the first two years';
      out.body = `<p>These are the 12+ months that retrospectively define menopause. FSH is still rising and oestradiol falling fast; levels stabilise around two years out.</p>
      <p><b>This is the peak symptom period</b> — hot flashes are most likely in the year or two after the final period, not in the years long before it. If you're struggling, this is when treatment tends to have the most to offer, and it sits squarely inside the window where guidelines say benefits outweigh risks for most healthy women.</p>${oneOvary}`;
    }
    out.flags.push('Any vaginal bleeding from now on needs prompt evaluation — see Red flags.');
    return out;
  }
  if (a.cycle==='skip'){
    out.stage='−1'; out.label='Late menopausal transition';
    out.body = `<p>Gaps of 60 days or more between periods put you in the late transition, which typically lasts <b>1–3 years</b>. FSH is high and fluctuating wildly.</p>
    <p><b>Hot flashes are most likely to start or intensify here.</b> Peak vasomotor risk straddles the final period — this stage and the two years after it.</p>
    <p>Pregnancy is still possible during the transition. Ask your clinician how long you need contraception — the answer depends on your age and what you are using.</p>${oneOvary}`;
    return out;
  }
  if (a.cycle==='var7'){
    out.stage='−2'; out.label='Early menopausal transition';
    out.body = `<p>A persistent difference of 7 days or more between consecutive cycle lengths is the defining marker of the early transition. FSH is raised and variable.</p>
    <p>Symptoms are genuinely variable at this stage — some women have none, others have significant hot flashes, sleep disruption and mood change. <b>Perimenopause is also the specific window where depression risk is elevated</b> (~40% higher odds than premenopause), so mood changes here deserve attention rather than dismissal.</p>${oneOvary}`;
    return out;
  }
  if (a.cycle==='short'){
    out.stage='−3a'; out.label='Late reproductive stage';
    out.body = `<p>Subtly shorter cycles with day 2–5 FSH beginning to rise. Periods are still regular, so this often gets missed — but you may already notice changes in sleep, mood, PMS intensity or energy.</p>
    <p>Symptoms starting <i>this</i> early tend to last longer overall: among women with frequent symptoms, when hot flashes begin before periods change the median total duration exceeds <b>11.8 years</b>, versus 3.4 years if they start after menopause. That's an argument for taking early symptoms seriously.</p>${oneOvary}`;
    return out;
  }
  out.stage='−3b'; out.label='Late reproductive stage (early)';
  out.body = `<p>Cycles are still regular and consistent. Egg reserve markers (AMH, follicle count) may already be low, but that doesn't predict symptoms and isn't worth testing without a specific reason.</p>
  <p>${a.vms==='lots' ? 'You reported bothersome hot flashes despite regular cycles. That combination is worth discussing with a clinician — both because early-onset symptoms tend to last longer, and because other causes (thyroid, medication, anxiety) deserve consideration.' : 'Nothing here needs managing yet. The most useful thing you can do at this stage is bank muscle and bone: resistance training twice a week and adequate protein are far easier to build now than to recover later.'}</p>${oneOvary}`;
  return out;
}

const STAGE_CAVEAT = `
<div class="callout info"><span class="ctitle">How menopause is actually diagnosed</span>
<p><b>If you are 45 or over:</b> NICE says diagnose from your symptoms and cycle changes — <b>and do not routinely use FSH testing.</b> Also not recommended: AMH, inhibin, oestradiol, antral follicle count, ovarian volume.</p>
<p><b>Why:</b> in the late transition FSH swings wildly from cycle to cycle. A "normal" FSH does not rule out perimenopause, and a high FSH in a woman over 45 doesn't change what happens next.</p>
<p><b>Blood tests do matter</b> if you're under 40, or 40–45 with symptoms and cycle change.</p>
<p><b>Saliva and urine hormone testing</b> for diagnosis or dosing is not recommended by any major body — "unnecessary and has not been proven to be accurate nor reliable."</p></div>
<p class="xtiny">This tool is based on the STRAW+10 international staging system, which anchors everything on the final menstrual period. STRAW+10 itself does not apply cleanly after a hysterectomy or ablation, or with PCOS, primary ovarian insufficiency, or during cancer treatment — so rather than forcing a stage, this tool asks about your uterus and your ovaries separately and tells you what can and cannot be concluded in your situation.</p>`;

<div class="callout ok"><span class="ctitle">Start here: the two levers with the best return</span>
<b>Enough protein</b> and <b>enough calcium and vitamin D from food</b>. Everything else on this page is refinement.</div>

<details class="acc" open><summary>Protein — the number that matters most</summary><div>
<p>The RDA of 0.8 g/kg/day (about 46 g) is a floor for preventing deficiency, not a target for preserving muscle. Guidelines for healthy older adults use <b>1.0–1.2 g/kg/day</b>; the resistance-training and body-composition literature uses <b>1.2–1.6 g/kg/day</b>; during intentional weight loss, <b>1.2–1.5 g/kg/day</b>.</p>

<details class="acc"><summary>Dietary patterns — what each one is actually good for</summary><div>
<ul class="tick">
  <li><b>Mediterranean</b> — in menopausal women specifically, benefits for weight, blood pressure, triglycerides, total and LDL cholesterol. ${EV.strong} for cardiometabolic outcomes. <b>Do not expect it to reduce hot flashes</b> — dietary modification for vasomotor symptoms is rated not recommended.</li>
